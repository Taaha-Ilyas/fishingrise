<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b2238">
<title>Fishing Rise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%231f7fae'/%3E%3Cpath d='M14 34c8-10 22-10 30 0-8 10-22 10-30 0z' fill='%23ffcf4a'/%3E%3Cpath d='M44 34l10-8v16z' fill='%23ffcf4a'/%3E%3Ccircle cx='21' cy='32' r='2.5' fill='%23123'/%3E%3C/svg%3E">
<style>
:root{--bg:#06121f;--panel:#10263d;--panel2:#16334f;--edge:#3c6f9c;--txt:#eaf5ff;--muted:#93b4cf;--accent:#46d7cf;--gold:#ffcf4a;--danger:#ff5a5a;--ok:#5fe07a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:'Fredoka','Trebuchet MS',system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#game{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none}
#ui{position:fixed;inset:0;pointer-events:none;z-index:5}
.hidden{display:none!important}
button{font-family:inherit}
.btn{position:relative;font:inherit;font-weight:600;font-size:15px;cursor:pointer;border:none;border-radius:12px;padding:9px 15px;background:linear-gradient(#3f86de,#2a5ea8);color:#fff;box-shadow:0 4px 0 #1b3f73,0 6px 14px rgba(0,0,0,.3);transition:transform .08s,filter .15s,box-shadow .08s;pointer-events:auto;white-space:nowrap}
.btn:hover{filter:brightness(1.12)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #1b3f73}
.btn.gold{background:linear-gradient(#ffd864,#e8a91b);color:#4a2b00;box-shadow:0 4px 0 #9a6a00,0 6px 14px rgba(0,0,0,.3)}
.btn.green{background:linear-gradient(#5fe07a,#2fa84a);color:#08310f;box-shadow:0 4px 0 #1f6a30,0 6px 14px rgba(0,0,0,.3)}
.btn.red{background:linear-gradient(#ff6a6a,#c83a3a);box-shadow:0 4px 0 #7a1f1f,0 6px 14px rgba(0,0,0,.3)}
.btn.ghost{background:rgba(255,255,255,.08);box-shadow:none;border:1px solid rgba(255,255,255,.2)}
.btn.big{font-size:19px;padding:12px 22px}
.btn.small{font-size:13px;padding:6px 10px;border-radius:9px}
.btn:disabled{filter:grayscale(.85) brightness(.7);cursor:not-allowed}
.iconbtn{width:46px;height:46px;padding:0;font-size:22px;display:flex;align-items:center;justify-content:center}
.iconbtn.small{width:34px;height:34px;font-size:16px}
#basketCount{position:absolute;top:-6px;right:-6px;background:#ff5a5a;color:#fff;font-size:11px;border-radius:10px;padding:1px 6px;min-width:18px}
#basketCount:empty{display:none}
.coin{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;margin:0 1px 0 3px;box-shadow:inset -2px -2px 0 rgba(0,0,0,.25),inset 2px 2px 0 rgba(255,255,255,.45),0 0 0 1px rgba(0,0,0,.25)}
.coin.b{background:#c67c3c}.coin.s{background:#d7dee5}.coin.g{background:#f6c636}.coin.p{background:linear-gradient(135deg,#f4fbff,#9fd3ff,#e9f6ff,#7ab8ff);box-shadow:inset -2px -2px 0 rgba(0,0,0,.2),0 0 8px #9fd3ff}
.coins{white-space:nowrap;font-weight:600}
.flycoin{position:fixed;z-index:50;width:18px;height:18px;transition:left .65s cubic-bezier(.4,0,.2,1),top .65s cubic-bezier(.6,-0.3,.4,1),transform .65s,opacity .65s;pointer-events:none}
/* HUD */
#hud{position:absolute;inset:0}
#questbox{position:absolute;left:12px;top:12px;max-width:min(330px,calc(100vw - 260px));min-width:200px;background:rgba(10,30,50,.86);border:2px solid #f0c24a;border-radius:14px;padding:8px 12px;pointer-events:auto;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.35)}
#questbox .qlabel{font-size:11px;letter-spacing:.12em;color:var(--gold);text-transform:uppercase}
#questbox .qtitle{font-weight:700;font-size:16px}
#questbox .qtext{font-size:13px;color:#cfe3f5;margin-top:2px;line-height:1.3}
#questbox.flash{animation:qflash 1s}
@keyframes qflash{0%{transform:scale(1)}20%{transform:scale(1.08);box-shadow:0 0 30px #ffd23a}100%{transform:scale(1)}}
#topright{position:absolute;right:12px;top:12px;display:flex;gap:8px;align-items:center;pointer-events:auto}
#coins{position:relative;background:rgba(10,30,50,.86);border:2px solid var(--edge);border-radius:12px;padding:7px 10px;font-weight:700;font-size:16px;display:flex;gap:8px;align-items:center}
#coins .cv{white-space:nowrap}
#coins.pulse{animation:cpulse .5s}
@keyframes cpulse{50%{transform:scale(1.1);border-color:var(--gold)}}
.moneyfloat{position:absolute;right:6px;top:100%;font-size:15px;color:#9effb0;animation:mfloat 1.4s forwards;white-space:nowrap;text-shadow:0 2px 3px #000}
.moneyfloat.neg{color:#ff9a9a}
@keyframes mfloat{from{transform:translateY(0);opacity:1}to{transform:translateY(26px);opacity:0}}
#locname{position:absolute;left:50%;top:14px;transform:translateX(-50%);font-weight:700;font-size:17px;text-shadow:0 2px 4px #000;background:rgba(0,0,0,.3);padding:4px 14px;border-radius:20px;white-space:nowrap}
#locname:empty{display:none}
@media (max-width:900px){#locname{top:auto;bottom:76px;font-size:14px}}
.tierchip{display:inline-block;color:#0b1a2a;font-size:11px;font-weight:700;padding:1px 7px;border-radius:9px;vertical-align:2px}
#bottombar{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:10px;align-items:center;pointer-events:auto;flex-wrap:wrap;justify-content:center;width:max-content;max-width:96vw}
#weight{background:rgba(10,30,50,.86);border:2px solid var(--edge);border-radius:12px;padding:6px 12px;display:flex;align-items:center;gap:8px;font-size:13px}
.wbar{width:130px;height:12px;background:rgba(0,0,0,.4);border-radius:6px;overflow:hidden}
.wfill{height:100%;width:0;background:var(--ok);transition:width .3s,background .3s}
.qarrow{animation:qglow 1s infinite}
.qarrow::before{content:'\2B07';position:absolute;left:50%;top:-34px;transform:translateX(-50%);font-size:26px;color:var(--gold);text-shadow:0 2px 4px #000,0 0 10px #ffd23a;animation:bob .7s infinite alternate;pointer-events:none}
@keyframes bob{to{top:-24px}}
@keyframes qglow{50%{box-shadow:0 0 0 3px #ffd23a,0 0 22px #ffd23a}}
/* touch pad */
#fishpad{position:absolute;left:0;right:0;bottom:24px;display:flex;justify-content:space-between;padding:0 20px}
.padbtn{pointer-events:auto;width:86px;height:86px;border-radius:50%;border:3px solid rgba(255,255,255,.5);background:rgba(20,60,100,.55);color:#fff;font-size:34px;touch-action:none}
.padbtn.on{background:rgba(90,220,140,.6)}
/* toasts / banner */
#toasts{position:absolute;top:74px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;width:max-content;max-width:92vw}
.toast{background:rgba(10,30,50,.94);border:2px solid var(--edge);padding:7px 14px;border-radius:12px;font-size:14px;animation:tin .3s ease-out,tout .4s 2.8s forwards;box-shadow:0 6px 16px rgba(0,0,0,.4);text-align:center}
.toast.quest{border-color:var(--gold)}.toast.money{border-color:var(--ok)}.toast.warn{border-color:var(--danger)}.toast.save{border-color:var(--accent)}
@keyframes tin{from{transform:translateY(-20px) scale(.9);opacity:0}}
@keyframes tout{to{transform:translateY(-10px);opacity:0}}
#banner{position:absolute;top:30%;left:0;right:0;text-align:center;pointer-events:none}
#banner.show{animation:bannerIn 3.6s forwards}
#banner .btitle{font-size:clamp(30px,6vw,58px);font-weight:700;text-shadow:0 4px 0 rgba(0,0,0,.5),0 0 30px rgba(0,0,0,.6);letter-spacing:.03em}
#banner .bsub{font-size:clamp(14px,2.2vw,20px);margin-top:6px;text-shadow:0 2px 4px #000}
@keyframes bannerIn{0%{opacity:0;transform:scale(.6)}12%{opacity:1;transform:scale(1.06)}20%{transform:scale(1)}82%{opacity:1}100%{opacity:0;transform:translateY(-20px)}}
/* dialog */
#dialog{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);width:min(720px,95vw);background:linear-gradient(#173a5c,#0e2640);border:2px solid #5a8fc0;border-radius:16px;padding:12px 16px;display:flex;gap:14px;align-items:flex-start;pointer-events:auto;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:tin .2s}
#portrait{flex:none;width:76px;height:76px}
.dbody{flex:1;min-height:76px;display:flex;flex-direction:column}
.dname{font-weight:700;color:var(--gold);font-size:17px}
.dtext{font-size:17px;line-height:1.4;flex:1;margin-top:2px}
.dhint{align-self:flex-end;font-size:12px;color:var(--muted);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.3}}
/* modal / panel */
#modal{position:absolute;inset:0;background:rgba(3,10,20,.6);display:flex;align-items:center;justify-content:center;pointer-events:auto;animation:fin .2s;padding:10px}
@keyframes fin{from{opacity:0}}
.panel{width:min(760px,96vw);max-height:92vh;display:flex;flex-direction:column;background:linear-gradient(#153555,#0d2238);border:2px solid var(--edge);border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.6);animation:pop .28s cubic-bezier(.2,1.4,.4,1);overflow:hidden}
.panel.wide{width:min(900px,96vw)}.panel.narrow{width:min(540px,96vw)}
@keyframes pop{from{transform:scale(.8);opacity:0}}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid #2b5679;font-size:21px;font-weight:700;background:rgba(0,0,0,.15)}
.panel-body{overflow:auto;padding:14px 16px;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.panel-body canvas{max-width:100%}
.row{display:flex;align-items:center;flex-wrap:wrap}.gap{gap:10px}.center{justify-content:center;text-align:center}
.muted{color:var(--muted)}.small{font-size:12px}
.hint{color:var(--muted);font-size:13px;margin:8px 0}
.warn{background:rgba(255,90,90,.15);border:1px solid rgba(255,90,90,.5);color:#ffc0c0;padding:7px 10px;border-radius:10px;margin:8px 0;font-size:14px}
.warnc{color:#ffb08a}.up{color:#8affb0}
.empty{text-align:center;color:var(--muted);padding:30px}
.sect{font-weight:700;color:var(--gold);margin:14px 0 6px;font-size:16px}
.menu-col{display:flex;flex-direction:column;gap:12px;align-items:stretch}
.shopkeep{display:flex;gap:12px;align-items:center;background:rgba(0,0,0,.2);border-radius:14px;padding:8px 12px;margin-bottom:10px}
.pcanvas{flex:none;width:64px;height:64px}
.sk-text{font-size:15px;line-height:1.35}
.card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px}
.card-title{font-weight:700;font-size:17px}.card-sub{color:var(--muted);font-size:14px}
.card-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.big-card canvas{width:100%;border-radius:10px}
.statline{font-size:13px;color:#cfe3f5;margin-top:4px}
.next{font-size:14px;margin:4px 0 6px}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
@media (max-width:620px){.twocol{grid-template-columns:1fr}}
#shipCv,#smithCv{width:100%;border-radius:12px;display:block}
/* fish list */
.basket-sum{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-weight:600;margin-top:8px}
.fishlist{display:flex;flex-direction:column;gap:6px}
.fishrow{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-left:4px solid #c3ced6;border-radius:10px;padding:5px 10px;transition:background .15s,transform .15s}
.fishrow:hover{background:rgba(255,255,255,.12);transform:translateX(3px)}
.fishrow.r1{border-left-color:#5fd36c}.fishrow.r2{border-left-color:#4aa8ff}.fishrow.r3{border-left-color:#b46dff}.fishrow.r4{border-left-color:#ffb52e;box-shadow:inset 0 0 18px rgba(255,181,46,.15)}.fishrow.r5{border-left-color:#ff4f7f;box-shadow:inset 0 0 18px rgba(255,79,127,.2)}
.fishrow canvas{width:66px;height:40px;flex:none;pointer-events:none}
.fr-main{flex:1;min-width:0}.fr-name{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fr-meta{font-size:12px;color:var(--muted)}
.fr-val{font-weight:600;white-space:nowrap}
.rchip{display:inline-block;color:#0b1a2a;font-weight:700;font-size:11px;padding:0 6px;border-radius:8px}
/* tooltip */
#tooltip{position:fixed;z-index:60;background:#0b1d30;border:2px solid var(--gold);border-radius:12px;padding:9px 12px;min-width:210px;box-shadow:0 10px 24px rgba(0,0,0,.6);pointer-events:none;font-size:14px}
.tt-name{font-weight:700;font-size:16px}.tt-sub{font-size:12px;color:var(--muted);margin-bottom:5px}
table.tt{border-collapse:collapse;width:100%}table.tt td{padding:2px 4px}table.tt td:last-child{text-align:right;font-weight:600}
table.tt.wide{max-width:360px;margin:10px auto;background:rgba(0,0,0,.2);border-radius:10px}
.tt-final td{border-top:1px solid rgba(255,255,255,.25);padding-top:5px;color:var(--gold)}
/* tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 4px}
.tabs.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}
.tab{font:inherit;font-weight:600;cursor:pointer;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#cfe3f5;padding:6px 14px;border-radius:20px;white-space:nowrap}
.tab.on{background:var(--gold);color:#4a2b00;border-color:var(--gold)}
/* blacksmith */
.smith-top{display:grid;grid-template-columns:1.6fr 1fr;gap:12px;align-items:center}
@media (max-width:620px){.smith-top{grid-template-columns:1fr}}
.eqlist{display:flex;flex-direction:column;gap:5px;font-size:14px;background:rgba(0,0,0,.2);border-radius:12px;padding:10px}
.partlist{display:flex;flex-direction:column;gap:6px}
.partrow{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:5px 10px}
.partrow.is-eq{border-color:var(--ok);background:rgba(95,224,122,.1)}
.partrow.locked{opacity:.5}
.partrow canvas{width:70px;height:44px;flex:none}
.pr-main{flex:1;min-width:0}.pr-name{font-weight:700}.pr-stat{font-size:12px;color:var(--muted)}
.badge{font-size:12px;font-weight:700;padding:4px 9px;border-radius:9px;white-space:nowrap}
.badge.eq{background:var(--ok);color:#08310f}.badge.lock{background:rgba(255,255,255,.08);color:var(--muted)}
/* bestiary */
.dexgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:8px}
.dexcard{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:8px;text-align:center;position:relative}
.dexcard canvas{width:120px;height:70px}
.dexcard.unk{opacity:.7}.dexcard.don{border-color:var(--gold)}
.dx-name{font-weight:700}.dx-meta{font-size:11px;color:var(--muted)}
.dx-dots{display:flex;justify-content:center;gap:4px;margin:4px 0}
.rdot{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.12);display:inline-block}
.dx-don{position:absolute;top:6px;right:8px;font-size:11px;color:var(--gold);font-weight:700}
/* catch & reveal */
.catch,.reveal,.victory{position:relative;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;overflow:hidden}
.catch canvas,.reveal canvas{width:100%;max-width:420px;position:relative;z-index:1}
.rays{-webkit-mask-image:radial-gradient(circle,#000 15%,transparent 62%);mask-image:radial-gradient(circle,#000 15%,transparent 62%);position:absolute;left:50%;top:110px;width:700px;height:700px;margin:-350px 0 0 -350px;background:repeating-conic-gradient(rgba(255,224,138,.16) 0 10deg,transparent 10deg 20deg);animation:spin 12s linear infinite;border-radius:50%;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
.newtag{position:absolute;top:8px;right:10px;z-index:2;background:linear-gradient(#ff6a8a,#e0305a);color:#fff;font-weight:700;font-size:22px;padding:4px 14px;border-radius:12px;transform:rotate(8deg);animation:newpop .6s cubic-bezier(.2,1.8,.4,1),wiggle 1.5s .6s infinite;box-shadow:0 4px 14px rgba(255,60,100,.5)}
@keyframes newpop{from{transform:scale(0) rotate(-40deg)}}
@keyframes wiggle{50%{transform:rotate(-4deg) scale(1.08)}}
.c-name,.rv-title{font-size:28px;font-weight:700;position:relative;z-index:1;text-shadow:0 3px 0 rgba(0,0,0,.4)}
.c-meta,.c-calc,.rv-desc{position:relative;z-index:1;font-size:15px}
.c-calc{background:rgba(0,0,0,.25);padding:6px 12px;border-radius:10px}
.catch .btn,.reveal .btn,.victory .btn{position:relative;z-index:1;margin-top:8px}
.catch.r4 .c-name,.catch.r5 .c-name{animation:shine 1.2s infinite alternate}
@keyframes shine{to{filter:brightness(1.4) drop-shadow(0 0 10px currentColor)}}
.big-p{font-size:18px;margin:8px 0}
textarea#codebox{width:100%;height:120px;background:#06121f;color:#9fd3ff;border:1px solid var(--edge);border-radius:10px;padding:8px;font-family:monospace;font-size:11px;margin:10px 0;user-select:text;-webkit-user-select:text}
/* quest log / howto / patch */
.qlog{display:flex;flex-direction:column;gap:6px}
.ql{padding:6px 10px;border-radius:9px;background:rgba(255,255,255,.04);font-size:14px}
.ql.done{color:#8affb0}.ql.cur{border:1px solid var(--gold);background:rgba(255,207,74,.08)}.ql.fut{color:var(--muted)}
.howto h3{color:var(--gold);margin:12px 0 4px;font-size:16px}.howto p{font-size:14px;line-height:1.45;margin-bottom:4px}
.patch{margin-bottom:14px}.p-title{font-weight:700;font-size:17px;color:var(--gold);margin:2px 0 6px}
.patch ul{padding-left:20px}.patch li{font-size:14px;line-height:1.4;margin-bottom:4px}
/* slots */
.slots{display:flex;flex-direction:column;gap:10px}
.slot{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:5px}
.slot.empty{opacity:.85}.sl-name{font-weight:700;font-size:16px}
/* map card */
#mapcard{position:absolute;right:14px;bottom:76px;width:min(360px,94vw);background:rgba(10,28,48,.95);border:2px solid var(--edge);border-radius:16px;padding:12px 14px;pointer-events:auto;box-shadow:0 10px 30px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:8px}
#mapcard.pop{animation:pop .25s cubic-bezier(.2,1.4,.4,1)}
.mc-head{display:flex;align-items:center;gap:8px}.mc-name{font-weight:700;font-size:19px;flex:1}
.mc-desc{font-size:14px;color:#cfe3f5;line-height:1.35}.mc-stats{font-size:13px;color:var(--muted)}
#mapcard .btn{margin-top:6px}
@media (max-width:620px){#mapcard{left:50%;right:auto;transform:translateX(-50%);bottom:70px}}
/* main menu */
#menu{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;pointer-events:auto;padding:16px}
#menu .menu-col{width:min(300px,86vw)}
.logo{text-align:center;animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.logo-top,.logo-bot{font-weight:700;line-height:.9;letter-spacing:.06em;background:linear-gradient(#fff6c8,#ffcf4a 55%,#e88a1b);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #5a2a00) drop-shadow(0 10px 20px rgba(0,0,0,.5))}
.logo-top{font-size:clamp(40px,8vw,78px)}.logo-bot{font-size:clamp(54px,11vw,110px)}
.logo-sub{margin-top:8px;font-size:clamp(14px,2vw,18px);color:#fff;text-shadow:0 2px 6px #000}
#menuver{position:absolute;bottom:10px;right:14px;font-size:13px;color:rgba(255,255,255,.7);text-shadow:0 1px 3px #000}
@media (max-height:560px){#menu{flex-direction:row;gap:30px}.logo-top{font-size:44px}.logo-bot{font-size:60px}}

.victory .rays{opacity:.45}
.victory table.tt td:first-child{text-align:left}
#hud.fishing #bottombar,#hud.fishing #locname{display:none}
#fishpad{bottom:max(14px,env(safe-area-inset-bottom))}
@media (max-height:520px){
  #locname{display:none}

<script>
// ================================================================
//  FISHING RISE — GAME DATA
// ================================================================
const GAME_VERSION = '1.2.0';
const UPDATE_NO = 3;

const PATCH_NOTES = [
  {
    v: 'Update 3 \u2014 v1.2.0', date: '28 October 2026', title: 'Charms, Beasts & Gadgets',
    notes: [
      'Four MINI-BOSSES guard the seas before the Kraken: Queen Coralia, Old Ironjaw, the Glimmerfin and the Lantern King. Each must be beaten before the next permit.',
      'Fish ABILITIES, all with clear warnings: Dash, Mud, Currents, Freeze, Decoys, Fire, Fade and Teleport (with a countdown marker showing where it will reappear). Dashes only start at Shellhaven, so the opening is gentler.',
      'Every region has something new: shipwrecks to salvage, oyster beds, worm pools, currents, ice shards, jellyfish, a Frenzy Lagoon, lava vents, pitch-black water with eel pits, and whirlpools.',
      'Hull damage: hazards hurt your boat, a damaged hull holds less weight, and fish can fall overboard. Bram repairs it for free in the village.',
      'Old Marlow\u2019s Tackle Hut is now the TALISMAN SHRINE. 30 hidden talismans with 5 set bonuses. Nobody tells you where they are \u2014 upgrade the shrine to see how many each region holds.',
      'New merchant: FIZZ the Tinkerer (rescue her in Mangrove Marsh). Boat modules (Outboard Motor boost, Sonar, Debris Magnet, Plating, Searchlight, Chum Dispenser, Turbo) and gadgets (Siren Horn pulls every fish to you, Repair Kit, Stun Spark, Lucky Bait).',
      'SKILLS: 18 skills across Fishing, Sailing and Fortune. Earn a skill point every level.',
      'New rarity system: Common, Uncommon, Rare, Epic, Legendary \u2014 plus the special Mythic and Divine, which only appear in the second half of the seas.',
      'Fish VARIANTS: Dusky, Pale, Striped, Golden and Spectral, each worth more.',
      '60 treasures (each region has its own set in every rarity), plus a new Treasure collection at the Museum.',
      'Museum rework: donate each rarity of a species to raise its sell price (+10% per rarity, doubled when a region\u2019s set is complete).',
      'Treasure chests can pop up on the catch bar while you\u2019re reeling \u2014 grab them for a bonus treasure.',
      'Quests: after the tutorial, gold arrows only appear when you press GO in the Quest Log.',
      'Special requests: visitors arrive at the dock asking for fish, materials or treasure, with rewards.',
      'Village badges: ! when there\u2019s something to do, a green arrow when you can afford an upgrade. Crates float by your boat showing your cargo.',
      'Rod parts now show clear multipliers (\u00d71, \u00d71.25, \u00d71.5...).',
      'You start with a smaller raft (5 kg) so boat upgrades matter more.',
      'Future levels and content are hidden until you\u2019re close to reaching them.',
      'Autosave indicator. The game saves after every catch, sale, upgrade and trip, and every 20 seconds.',
      'Map animations, new character art, fixed floating houses and villagers\u2019 arms, and removed the un-collectable logs in Driftwood Shallows.'
    ]
  },
  {
    v: 'Update 2 — v1.1.0', date: '28 October 2026', title: 'The Village Rises',
    notes: [
      'Driftwood Isle is now one harbour hub (inspired by Dredge). Every merchant lives here — hover a building to see its name, click to visit.',
      'Fishing only happens out at sea. Expeditions end by returning to the village or opening the world map.',
      'Merchants were scattered by the Kraken’s storms! Find the Curator, Greta the Blacksmith and Opaline the luxury dealer stranded at sea, rescue them and bring them home.',
      'Upgrade every merchant (up to level 5) to unlock better rod parts, boats, sell prices and more. Their buildings grow and change with each level.',
      'Village levels (Town Hall): upgrade with coins and materials for permanent buffs to XP, sell prices, hold size, luck and treasure finding.',
      'New player levels: earn XP from every catch, rescue and treasure. Levels unlock parts, boats, permits and upgrades.',
      'Permits: catch every species in a region and reach the required level to buy the permit for the next region at the Town Hall.',
      'New materials floating at sea (driftwood, rope, scrap metal, sailcloth, sea glass) used to build up the village.',
      'Rare treasures: look for glinting water, and sometimes a treasure comes up on your hook. Sell them to Opaline.',
      'The world map is now ocean-first with small islands and unique water in each region. Uncharted regions are hidden under clouds. Double-click a region to travel.',
      'New minigame controls: the catch box drifts left on its own. Hold SPACE (or the REEL button on touch) to push it right. The rod decides how fast it moves.',
      'Mouse / touch-follow control is now an accessibility option in Settings.',
      'You start much weaker (worse rod, smaller raft, slower boat) and grow stronger through upgrades.',
      'Bronze coins are now copper coins.',
      'Fish shadows no longer overlap each other.',
      'Quest Log has its own button on the HUD.',
      'Brand-new art for the village, buildings, boats and sea.'
    ]
  },
  {
    v: 'Update 1 — v1.0.0', date: '28 October 2026', title: 'Fishing Rise sets sail!',
    notes: [
      'The first release of Fishing Rise: a poor village start, a broken rod and the legendary Kraken.',
      'Palworld-style fishing bar, 10 areas, 50 fish species, 6 rarities, the Kraken boss fight.',
      'Fishmonger, tackle hut, blacksmith, shipwright and the Curator’s bestiary.',
      'Guided quests, main menu, save slots and save codes.'
    ]
  }
];

// ---------------- Rarities (shared by fish, treasures and talismans) ----------------
// Common..Legendary are the normal rarities; Mythic & Divine are special and only appear in the second half of the seas.
const RARITIES = [
  { n: 'Common',    m: 1.0, c: '#c3ced6', w: 62,   lo: 0,     hi: 0.45 },
  { n: 'Uncommon',  m: 1.2, c: '#5fd36c', w: 25,   lo: 0.45,  hi: 0.7 },
  { n: 'Rare',      m: 1.5, c: '#4aa8ff', w: 9,    lo: 0.7,   hi: 0.85 },
  { n: 'Epic',      m: 2.0, c: '#b46dff', w: 3,    lo: 0.85,  hi: 0.94 },
  { n: 'Legendary', m: 3.0, c: '#ffb52e', w: 0.8,  lo: 0.94,  hi: 0.98 },
  { n: 'Mythic',    m: 5.0, c: '#ff4f7f', w: 0.18, lo: 0.98,  hi: 0.995 },
  { n: 'Divine',    m: 10,  c: '#8ff5ff', w: 0.035, lo: 0.995, hi: 1 }
];
const SPECIAL_FROM_AREA = 5;
function rarityOf(t) { let r = 0; for (let i = 0; i < RARITIES.length; i++) if (t >= RARITIES[i].lo) r = i; return r; }
function rollRarity(area, luck, weights) {
  const max = area >= SPECIAL_FROM_AREA ? 6 : 4;
  const ws = RARITIES.map((R, i) => i > max ? 0 : (weights ? weights[i] : R.w) * Math.pow(1 + 0.12 * (luck || 0), i));
  let tot = ws.reduce((a, b) => a + b, 0), r = Math.random() * tot;
  for (let i = 0; i < ws.length; i++) { r -= ws[i]; if (r <= 0) return i; }
  return 0;
}
function rollSize(r) { const R = RARITIES[r]; return R.lo + Math.random() * (R.hi - R.lo); }
function rarityChip(r) { return `<span class="rchip r${r}" style="background:${RARITIES[r].c}">${RARITIES[r].n}</span>`; }

function rollVariant(bonus) { const ws = VARIANTS.map((v, i) => i ? v.w * (1 + (bonus || 0)) : v.w); let t = ws.reduce((a, b) => a + b, 0), r = Math.random() * t; for (let i = 0; i < ws.length; i++) { r -= ws[i]; if (r <= 0) return i; } return 0; }
function variantSp(sp, v) {
  if (!v) return sp;
  const o = Object.assign({}, sp, { _v: v });
  if (v === 1) { o.c1 = shade(sp.c1, -0.4); o.c2 = shade(sp.c2, -0.35); o.c3 = shade(sp.c3, -0.3); }

  else if (v === 3) { o.pat = 'bands'; o.c3 = shade(sp.c1, -0.55); }
  else if (v === 4) { o.c1 = '#f2b822'; o.c2 = '#fff3b0'; o.c3 = '#c98a10'; o.pat = sp.pat === 'none' ? 'scales' : sp.pat; o.goldGlow = 1; }
  else if (v === 5) { o.c1 = '#7ae8ff'; o.c2 = '#e8fbff'; o.c3 = '#b48aff'; o.pat = 'glow'; o.ghost = 1; }
  return o;
}

const PF = { speed: t => 1 + 0.25 * t, reel: t => 1 + 0.2 * t, box: t => 1 + 0.14 * t, grip: t => 1 / (1 - 0.045 * t) };

    accel: 1.35 * (1 + 0.18 * r) * (1 + g('speed')), vmax: 0.4 * PF.speed(r) * (1 + g('speed')), power: r,

    inv: g('inv'), warn: g('warn'), startProg: g('startProg'), stun: g('stun'), secondWind: g('secondWind'), focus: g('focus'), chest: g('chest')
  };
}
function partStatText(kind, t) {
  if (kind === 'rod') return `Box speed ${fx2(PF.speed(t))} \u00b7 Power ${t}`;

  if (v >= 3) { b.hold += 0.10; b.sell += 0.05; }

}

// top-down fish shadow

// ---------------- Rod ----------------
// handle at (x,y), rod points along ang. bend in [-1,1]. returns tip position.

  const R = RARITIES[T.r], setCol = TAL_SETS[T.set].col, h = T.id.split('').reduce((a, ch) => a + ch.charCodeAt(0), 0) % 5;
  c.save(); c.translate(x, y); c.scale(s, s);
  if (!sil && T.r >= 3) { c.shadowColor = R.c; c.shadowBlur = 8 + 5 * Math.sin(t * 3); }
  c.strokeStyle = sil || '#8a6a44'; c.lineWidth = 1.6; c.beginPath(); c.moveTo(-10, -16); c.quadraticCurveTo(0, -4, 10, -16); c.stroke();
  c.fillStyle = sil || R.c;
  c.beginPath();
  if (h === 0) c.arc(0, 2, 10, 0, TAU);
  else if (h === 1) { c.moveTo(0, -8); c.bezierCurveTo(12, -2, 8, 14, 0, 14); c.bezierCurveTo(-8, 14, -12, -2, 0, -8); }
  else if (h === 2) { for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i / 10 * TAU, r = i % 2 ? 5 : 12; c.lineTo(Math.cos(a) * r, 3 + Math.sin(a) * r); } c.closePath(); }
  else if (h === 3) { c.arc(0, 3, 11, 0.6, TAU - 0.6); c.arc(5, 3, 8, TAU - 0.9, 0.9, true); c.closePath(); }
  else { c.moveTo(0, -8); c.lineTo(10, 3); c.lineTo(0, 14); c.lineTo(-10, 3); c.closePath(); }
  c.fill();
  c.shadowBlur = 0;
  if (!sil) {
    c.strokeStyle = shade(R.c, -0.35); c.lineWidth = 1.5; c.stroke();
    c.fillStyle = setCol; c.beginPath(); c.arc(0, 3, 4, 0, TAU); c.fill();
    c.fillStyle = 'rgba(255,255,255,.7)'; c.beginPath(); c.arc(-1.5, 1.5, 1.4, 0, TAU); c.fill();
    if (T.r >= 5) { for (let i = 0; i < 3; i++) { const a = t * 2 + i * 2.1; c.fillStyle = R.c; c.beginPath(); c.arc(Math.cos(a) * 15, 3 + Math.sin(a) * 15, 1.6, 0, TAU); c.fill(); } }
  }
  c.restore();
}

const Scenes = {};
let scene = null, sceneName = '';
function go(name, arg) {
  if (scene && scene.exit) scene.exit();
  sceneName = name; scene = Scenes[name];
  const hud = document.getElementById('hud'); if (hud) hud.classList.remove('fishing');

  updateHUD();
}
const fade = { a: 0, dir: 0, cb: null };
function transition(cb) { if (fade.dir) return; fade.dir = 1; fade.cb = cb; }

// ---------- particles ----------
function addP(list, p) { list.push(Object.assign({ x: 0, y: 0, vx: 0, vy: 0, g: 0, life: 1, max: 1, r: 3, col: '#fff', fade: 1, shrink: 0 }, p)); }
function updP(list, dt) {
  for (let i = list.length - 1; i >= 0; i--) {
    const p = list[i]; p.life -= dt; if (p.life <= 0) { list.splice(i, 1); continue; }
    p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; if (p.drag) { p.vx *= 1 - p.drag * dt; p.vy *= 1 - p.drag * dt; }
  }
}
function drawP(c, list) {
  for (const p of list) {
    const k = p.life / p.max;
    c.globalAlpha = p.fade ? Math.min(1, k * 1.5) : 1;
    c.fillStyle = p.col;
    if (p.txt) { c.font = `bold ${p.r}px Fredoka, sans-serif`; c.textAlign = 'center'; c.strokeStyle = 'rgba(0,0,0,.6)'; c.lineWidth = 3; c.strokeText(p.txt, p.x, p.y); c.fillText(p.txt, p.x, p.y); }
    else if (p.ring) { c.strokeStyle = p.col; c.lineWidth = 2; c.beginPath(); c.arc(p.x, p.y, p.r * (1 + (1 - k) * p.ring), 0, TAU); c.stroke(); }
    else { c.beginPath(); c.arc(p.x, p.y, Math.max(0.3, p.shrink ? p.r * k : p.r), 0, TAU); c.fill(); }
  }
  c.globalAlpha = 1;
}
function splash(list, x, y, n, col, power = 1) {
  for (let i = 0; i < n; i++) { const a = -Math.PI / 2 + rand(-1.1, 1.1); const sp = rand(60, 180) * power; addP(list, { x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, g: 380, life: rand(0.4, 0.8), max: 0.8, r: rand(1.5, 3.5), col: col || 'rgba(220,245,255,.9)' }); }
  addP(list, { x, y, life: 0.6, max: 0.6, r: 8 * power, ring: 3, col: 'rgba(255,255,255,.7)' });
}
function floatText(list, x, y, txt, col, size = 18) { addP(list, { x, y, vy: -40, life: 1.6, max: 1.6, txt, col, r: size }); }

Scenes.menu = {
  enter() { this.t = 0; this.jumps = []; this.fx = []; showMenu(true); },
  exit() { showMenu(false); },
  update(dt) {
    this.t += dt; updP(this.fx, dt);
    if (Math.random() < dt * 0.6) this.jumps.push({ x: rand(W * 0.1, W * 0.9), t: 0, sp: pick(SPECIES), L: rand(26, 48), dir: Math.random() < 0.5 ? 1 : -1 });
    this.jumps.forEach(j => { j.t += dt; if (Math.abs(j.t - 0.02) < dt) splash(this.fx, j.x, H * 0.62, 8); if (Math.abs(j.t - 1.0) < dt) splash(this.fx, j.x + j.dir * 80, H * 0.62, 8); });
    this.jumps = this.jumps.filter(j => j.t < 1.1);
  },
  draw() {
    const t = this.t;
    const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#1b3a6b'); g.addColorStop(0.45, '#f08a5d'); g.addColorStop(0.62, '#ffcf8a'); g.addColorStop(0.62, '#2a7fae'); g.addColorStop(1, '#06233f');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ffe9b0'; ctx.shadowColor = '#ffcf6a'; ctx.shadowBlur = 60; ctx.beginPath(); ctx.arc(W * 0.5, H * 0.6, Math.min(W, H) * 0.12, Math.PI, 0); ctx.fill(); ctx.shadowBlur = 0;
    // islands
    ctx.fillStyle = '#3a2a4a'; ctx.beginPath(); ctx.ellipse(W * 0.15, H * 0.62, W * 0.12, H * 0.05, 0, Math.PI, 0); ctx.fill();
    ctx.beginPath(); ctx.ellipse(W * 0.86, H * 0.62, W * 0.09, H * 0.035, 0, Math.PI, 0); ctx.fill();
    // waves
    for (let i = 0; i < 9; i++) {
      const y = H * 0.62 + i * i * 6 + 6;
      ctx.strokeStyle = `rgba(255,220,170,${0.35 - i * 0.03})`; ctx.lineWidth = 1.5;
      ctx.beginPath(); for (let x = 0; x <= W; x += 12) { const yy = y + Math.sin(x * 0.02 + t * (1 + i * 0.2) + i) * (2 + i); x ? ctx.lineTo(x, yy) : ctx.moveTo(x, yy); } ctx.stroke();
    }
    // jumping fish
    this.jumps.forEach(j => { const u = j.t / 1.0; if (u > 1) return; const x = j.x + j.dir * 80 * u, y = H * 0.62 - Math.sin(u * Math.PI) * 90; drawFish(ctx, j.sp, x, y, j.L, { sil: '#20304a', flip: j.dir < 0, rot: (u - 0.5) * 1.6 * j.dir, t }); });
    drawP(ctx, this.fx);
    // boat
    drawBoatSide(ctx, W * 0.5 + Math.sin(t * 0.3) * W * 0.15, H * 0.64, 4, 3, Math.min(1, W / 900) * 0.9, t);
    // birds
    ctx.strokeStyle = '#2a2040'; ctx.lineWidth = 2;
    for (let i = 0; i < 5; i++) { const bx = ((t * 30 + i * 180) % (W + 200)) - 100, by = H * 0.2 + Math.sin(i * 3 + t) * 20 + i * 18, f = Math.sin(t * 6 + i) * 5; ctx.beginPath(); ctx.moveTo(bx - 8, by - f); ctx.quadraticCurveTo(bx - 4, by - 4, bx, by); ctx.quadraticCurveTo(bx + 4, by - 4, bx + 8, by - f); ctx.stroke(); }
  }
};

function bubble(c, x, y, txt) {
  c.font = 'bold 14px Fredoka, sans-serif'; const w = c.measureText(txt).width + 18;
  c.fillStyle = 'rgba(255,255,255,.95)'; rrect(c, x - w / 2, y - 14, w, 26, 10); c.fill();
  c.beginPath(); c.moveTo(x - 6, y + 12); c.lineTo(x, y + 19); c.lineTo(x + 6, y + 12); c.fill();
  c.fillStyle = '#123'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(txt, x, y);
}
function questArrowDown(c, x, y) {
  c.save(); c.translate(x, y); c.fillStyle = '#ffd23a'; c.strokeStyle = '#7a4a00'; c.lineWidth = 3; c.shadowColor = '#ffd23a'; c.shadowBlur = 14;
  c.beginPath(); c.moveTo(-9, -26); c.lineTo(9, -26); c.lineTo(9, -6); c.lineTo(20, -6); c.lineTo(0, 16); c.lineTo(-20, -6); c.lineTo(-9, -6); c.closePath(); c.fill(); c.shadowBlur = 0; c.stroke(); c.restore();
}
function edgeArrow(side, y, distance) {
  const x = side < 0 ? 34 : W - 34, b = Math.sin(performance.now() / 160) * 5 * side;
  ctx.save(); ctx.translate(x + b, y); ctx.scale(side, 1);
  ctx.fillStyle = '#ffd23a'; ctx.strokeStyle = '#7a4a00'; ctx.lineWidth = 3; ctx.shadowColor = '#ffd23a'; ctx.shadowBlur = 14;
  ctx.beginPath(); ctx.moveTo(-22, -9); ctx.lineTo(-2, -9); ctx.lineTo(-2, -20); ctx.lineTo(20, 0); ctx.lineTo(-2, 20); ctx.lineTo(-2, 9); ctx.lineTo(-22, 9); ctx.closePath(); ctx.fill(); ctx.shadowBlur = 0; ctx.stroke(); ctx.restore();
  if (distance != null) { ctx.fillStyle = '#fff'; ctx.font = 'bold 12px Fredoka, sans-serif'; ctx.textAlign = 'center'; ctx.fillText(Math.round(distance / 10) + 'm', x, y + 36); }
}

  const total = S.basket.reduce((a, f) => a + fishValue(f), 0);
  return `<div class="basket-sum"><span>${S.basket.length} fish · ${basketWeight().toFixed(1)} / ${capacity()} kg</span><span>Total value: ${coinHTML(total)}</span></div>
   <div class="hint">${isTouch ? 'Tap and hold' : 'Hover over'} a fish to see how its price is worked out.</div>
   <div class="fishlist">${list.map(f => fishRow(f, mode)).join('')}</div>`;
}
function openBasket() {
  openPanel('basket', '🧺 Basket', () => {
    const tab = PANEL.tab || 'fish';
    const tabs = [['fish', `Fish (${S.basket.length})`]];
    if (S.stats.treasures) tabs.push(['tre', `Treasures (${S.treasures.length})`]);
    if (RES_KEYS.some(k => S.stats.resGot[k])) tabs.push(['res', 'Materials']);
    let body = '';

    else if (tab === 'tre') body = S.treasures.length ? `<div class="fishlist">${S.treasures.map(tr => treasureRow(tr, false)).join('')}</div><div class="hint center">${S.merchants.opaline ? 'Sell treasures at Opaline’s Curio Boutique.' : 'A luxury dealer would pay well for these... if only one lived in the village.'}</div>` : '<div class="empty">No treasures right now.</div>';

    return (tabs.length > 1 ? `<div class="tabs">${tabs.map(([k, n]) => `<button class="tab ${k === tab ? 'on' : ''}" data-act="tab" data-tab="${k}">${n}</button>`).join('')}</div>` : '') + body;

function sellFish(ids, fromEl) {
  let total = 0, n = 0;
  ids.forEach(id => { const i = S.basket.findIndex(f => f.id == id); if (i < 0) return; total += fishValue(S.basket[i]); S.basket.splice(i, 1); n++; });
  if (!n) return;
  S.stats.sold += n; addMoney(total); flyCoins(fromEl, 3 + n); sfx('coin');
  toast(`Sold ${n} fish for ${coinHTML(total)}`, 'money');

function globalKey(k) {
  if (sceneName === 'menu') { if (k === 'escape' && PANEL) { closePanel(); return true; } return false; }
  if (DLG) { if (k === ' ' || k === 'enter' || k === 'e' || k === 'escape') { advanceDialog(); return true; } return true; }
  if (PANEL) {
    if (k === 'escape' && !PANEL.noClose) { closePanel(); return true; }
    if ((k === ' ' || k === 'enter') && PANEL.id === 'catch' && CATCH) { const fits = CATCH.fish.w <= capacity() - basketWeight() + 1e-6; if (fits) finishCatch('keep'); return true; }
    return true;
  }
  if (sceneName === 'boss') return false;
  const fishing = sceneName === 'sea' && Scenes.sea.state !== 'sail';
  if (k === 'escape') { if (sceneName === 'map') { leaveMap(); return true; } openPause(); return true; }
  if (fishing) return false;
  if (k === 'b') { openBasket(); return true; }
  if (k === 'q') { openQuestLog(); return true; }
  if (k === 'k' && S.level >= 2) { openSkills(); return true; }
  return false;
}

// ---------------- HUD ----------------
function updateHUD() {
  const hud = $('#hud');
  const inGame = S && sceneName && sceneName !== 'menu' && sceneName !== 'boss';
  hud.classList.toggle('hidden', !inGame);
  if (!inGame) return;
  updateCoins(); updateXP(); updateRes();
  const sea = sceneName === 'sea', map = sceneName === 'map', vil = sceneName === 'village';
  $('#weight').classList.toggle('hidden', !(sea || map));
  $('#hullbox').classList.toggle('hidden', !(sea || map));
  $('#btnVillage').classList.toggle('hidden', !(sea || (map && S.loc.type === 'sea')));
  $('#btnMap').classList.toggle('hidden', !sea);
  $('#btnSail').classList.toggle('hidden', !vil);
  $('#btnCloseMap').classList.toggle('hidden', !map);
  $('#residents').classList.toggle('hidden', !vil || !(S.requests || []).length);
  const A = sea ? AREAS[S.loc.area] : null;
  $('#locname').innerHTML = vil ? `<span class="ln-big">DRIFTWOOD ISLE</span><span class="ln-sub">Village Lv ${S.village}</span>` : sea ? `<span class="ln-big">${esc(A.sea.toUpperCase())}</span><span class="ln-sub" style="color:${TIER_COL[A.tier]}">Tier ${A.tier} · ${areaFound(S.loc.area)}/5 species</span>` : map ? '<span class="ln-big">WORLD MAP</span>' : '';
  if (vil) renderVisitors();
  updateWeight(); renderQuest(false);
  const n = S.basket.length + S.treasures.length;
  $('#basketCount').textContent = n ? n : '';

  $('#skillCount').textContent = S.sp > 0 ? S.sp : '';
}
function updateWeight() {
  if (!S) return;
  const w = basketWeight(), cap = capacity(), f = clamp(w / Math.max(0.1, cap), 0, 1);
  $('#weight .wfill').style.width = (f * 100) + '%';
  $('#weight .wfill').style.background = f > 0.9 ? '#ff5a5a' : f > 0.7 ? '#ffcf4a' : '#5fe07a';
  $('#weight .wtext').textContent = `${w.toFixed(1)} / ${cap} kg`;
  const hf = hullFrac();
  $('#hullbox .hfill').style.width = (hf * 100) + '%';
  $('#hullbox .hfill').style.background = hf < 0.3 ? '#ff5a5a' : hf < 0.65 ? '#ffcf4a' : '#5ad1ff';
  $('#hullbox .htext').textContent = `${Math.round(Math.min(S.hullHp, maxHull()))}/${maxHull()}`;
}
function renderVisitors() {

function questTarget() { if (!S) return null; const q = QUESTS[S.quest]; if (!q || !questTracked()) return null; return q.target(); }

    const here = Scenes.sea.area;
    if (qt) {
      if (qt.bld || qt.village || (qt.rescue && S.aboard === qt.rescue)) vil = true;
      else if ((qt.area != null && qt.area !== here) || (qt.rescue && MERCHANTS[qt.rescue].area !== here) || (qt.boss && BOSSES[qt.boss].area !== here)) map = true;

// ---------------- requests (special visits) ----------------
function maybeNewRequest() {
  if (!S || S.stats.caught < 5 || !S.merchants.curator) return;
  S.requests = S.requests || [];
  if (S.requests.length >= 2 || Math.random() > 0.55) return;
  const open = AREAS.map((a, i) => i).filter(i => S.permits[i]);
  const area = pick(open.slice(-3));
  const known = speciesInArea(area).filter(sp => S.dex[sp.id]);
  const V = pick(VISITORS.filter(v => !S.requests.some(r => r.who === v.n)));
  let rq;
  const roll = Math.random();
  if (roll < 0.6 && known.length) { const sp = pick(known), minR = Math.random() < 0.6 ? 0 : Math.random() < 0.7 ? 1 : 2; rq = { type: 'fish', sp: sp.id, minR }; }
  else if (roll < 0.85) { const k = pick(resPool(area)); rq = { type: 'res', k, n: 4 + randi(0, 4) + area * 2 }; }
  else rq = { type: 'tre', area };
  rq.who = V.n; rq.look = V.look; rq.area = area; rq.id = ++S.reqCount;
  const base = rq.type === 'fish' ? SPECIES_BY_ID[rq.sp].base * RARITIES[rq.minR].m * 3 : rq.type === 'res' ? 20 * rq.n * (1 + area) : treasuresInArea(area)[0].v * 2.5;
  rq.coins = Math.round(base); rq.xp = Math.round(fishXP({ tier: AREAS[area].tier }, 1) * 4);
  const pool = resPool(area); rq.rk = pick(pool); rq.rn = 3 + area;
  S.requests.push(rq);
  setTimeout(() => toast(`📬 <b>${esc(V.n)}</b> has come to the village with a special request!`, 'quest'), 900);
}
function requestText(rq) {
  if (rq.type === 'fish') return `Bring me a ${rq.minR ? RARITIES[rq.minR].n + ' or better ' : ''}${SPECIES_BY_ID[rq.sp].name}.`;
  if (rq.type === 'res') return `I need ${rq.n} ${RESOURCES[rq.k].n}.`;
  return `Bring me any treasure from ${AREAS[rq.area].sea}.`;
}
function requestShort(rq) { if (rq.type === 'fish') return (rq.minR ? RARITIES[rq.minR].n + '+ ' : '') + SPECIES_BY_ID[rq.sp].name; if (rq.type === 'res') return `${rq.n} ${RESOURCES[rq.k].n}`; return `Treasure: ${AREAS[rq.area].sea}`; }
function requestRewardText(rq) { return `${coinHTML(rq.coins)} + ${rq.xp} XP + ${rq.rn} ${RESOURCES[rq.rk].n}`; }
function requestMatch(rq) {
  if (rq.type === 'fish') { const list = S.basket.filter(f => f.sp === rq.sp && f.r >= rq.minR).sort((a, b) => fishValue(a) - fishValue(b)); return list[0] || null; }
  if (rq.type === 'res') return resCount(rq.k) >= rq.n ? true : null;
  const list = S.treasures.filter(tr => TREASURE_BY_ID[tr.tid] && TREASURE_BY_ID[tr.tid].area === rq.area).sort((a, b) => treasureValue(a) - treasureValue(b)); return list[0] || null;
}
function openRequest(i) {

// ---------------- catch card ----------------
function showCatchCard(fish, isNew, onDone) {
  const sp = SPECIES_BY_ID[fish.sp], R = RARITIES[fish.r], V = VARIANTS[fish.v || 0], vsp = variantSp(sp, fish.v);
  const d = dexEntry(fish.sp); d.n++; d.best = Math.max(d.best, fish.w); d.rar[fish.r] = 1; d.vars[fish.v || 0] = 1;
  S.stats.caught++;
  const xp = gainXP(fishXP(sp, fish.r) * (fish.v ? 1.5 : 1));
  const free = capacity() - basketWeight(), fits = fish.w <= free + 1e-6;
  let throwBack = [];
  if (!fits) {
    const sorted = S.basket.slice().sort((a, b) => fishValue(a) / Math.max(0.1, a.w) - fishValue(b) / Math.max(0.1, b.w));
    let need = fish.w - free;
    for (const f of sorted) { if (need <= 0) break; if (fishValue(f) >= fishValue(fish)) continue; throwBack.push(f); need -= f.w; }
    if (need > 0) throwBack = null;
  }
  CATCH = { fish, isNew, onDone, throwBack };
  if (isNew || fish.r >= 3 || fish.v >= 4) sfx('newsp');
  const areaDone = isNew && areaComplete(sp.area);
  const donatable = canDonate(fish);
  openPanel('catch', isNew ? '✨ New species discovered!' : fish.v ? `✨ A ${V.n} variant!` : 'You caught a fish!', () => `
    <div class="catch ${isNew ? 'isnew' : ''} r${fish.r}">${isNew ? '<div class="rays"></div><div class="newtag">NEW!</div>' : fish.v ? `<div class="newtag vtag v${fish.v}">${V.n.toUpperCase()}!</div>` : ''}
      <canvas id="catchCv" width="420" height="190" data-fid="${fish.id}"></canvas>
      <div class="c-name" style="color:${R.c}">${esc(sp.name)}</div>
      <div class="c-meta">${rarityChip(fish.r)}${fish.v ? ` <span class="vchip v${fish.v}">${V.n} ${V.m}×</span>` : ''} Tier ${sp.tier} · ${fish.w} kg · <span class="xpgain">+${xp} XP</span></div>
      <div class="c-calc">Base ${coinHTML(sp.base)} × ${R.n} ${R.m}×${fish.v ? ` × ${V.n} ${V.m}×` : ''}${museumBonus(fish.sp) > 0 ? ` × museum +${Math.round(museumBonus(fish.sp) * 100)}%` : ''}${sellBonus() > 0 ? ` × market +${Math.round(sellBonus() * 100)}%` : ''} = <b>${coinHTML(fishValue(fish))}</b></div>
      ${isNew ? `<div class="c-meta">${esc(AREAS[sp.area].sea)} species: <b>${areaFound(sp.area)}/5</b>${areaDone ? ' — <span class="up">region complete!</span>' : ''}</div>` : ''}
      ${donatable ? `<div class="c-meta up">🐚 The Museum doesn’t have a ${R.n} ${esc(sp.name)} yet!</div>` : ''}
      ${fits ? `<button class="btn gold big" data-act="keep">Into the basket!</button>`
      : `<div class="warn">Your hold is too full for this fish (${free.toFixed(1)} kg free).</div><div class="row gap center">
         ${throwBack ? `<button class="btn gold" data-act="swap">Make room (throw back ${throwBack.length} cheaper fish)</button>` : ''}
         <button class="btn" data-act="release">Release it</button></div>`}
    </div>`, {
    cls: 'narrow', noClose: true, anim: dt => {
      PANEL.t = (PANEL.t || 0) + dt; const cv = $('#catchCv'); if (!cv) return;
      const c = cv.getContext('2d'), w = cv.width, h = cv.height, t = PANEL.t;
      c.clearRect(0, 0, w, h);
      const pop = Math.min(1, easeOutBack(clamp(t / 0.6, 0, 1)));
      if (fish.r >= 3 || isNew || fish.v >= 4) { c.save(); c.translate(w / 2, h / 2); c.rotate(t * 0.5); const col = fish.r >= 3 ? R.c : fish.v >= 4 ? '#ffe08a' : '#ffe08a'; const rg = c.createRadialGradient(0, 0, 10, 0, 0, h * 0.75); rg.addColorStop(0, col + '66'); rg.addColorStop(1, col + '00'); c.fillStyle = rg; for (let i = 0; i < 12; i++) { c.rotate(TAU / 12); c.beginPath(); c.moveTo(0, 0); c.lineTo(w, -34); c.lineTo(w, 34); c.fill(); } c.restore(); }
      drawFish(c, vsp, w / 2, h / 2 + Math.sin(t * 2) * 4, Math.min(250, 140 + fish.r * 16) * pop, { t, glow: fish.r >= 4, rot: Math.sin(t * 1.5) * 0.06 });
      if (Math.random() < dt * (isNew || fish.r >= 5 ? 30 : 8)) { PANEL.sp = PANEL.sp || []; addP(PANEL.sp, { x: rand(0, w), y: rand(0, h), vy: -20, life: 1, max: 1, r: rand(1.5, 3), col: isNew ? '#ffe08a' : R.c }); }
      if (PANEL.sp) { updP(PANEL.sp, dt); drawP(c, PANEL.sp); }
    }
  });
  if (areaDone) setTimeout(() => toast(`<b>${esc(AREAS[sp.area].sea)} complete!</b>`, 'quest'), 700);

function finishCatch(action) {
  const C = CATCH; if (!C) return;
  if (action === 'keep' || action === 'swap') {
    if (action === 'swap' && C.throwBack) C.throwBack.forEach(f => { const i = S.basket.indexOf(f); if (i >= 0) S.basket.splice(i, 1); });
    S.basket.push(C.fish);
  } else toast('You released the fish. It swims away happily.');
  CATCH = null; closePanel();
  questTick(); updateHUD(); save(true);
  if (basketWeight() >= capacity() - 0.05) toast('Your hold is full! Head back to the village to sell.', 'warn');
  C.onDone && C.onDone();
}

function bossPrompt(id) {

    <div class="center"><p class="big-p"><b>${esc(B.title)}</b><br>${beaten ? `${esc(B.name)} has returned. Fight again for treasure?` : B.kraken ? 'The water churns. Two enormous eyes open beneath the whirlpool...' : `A huge shadow circles beneath you. ${esc(B.name)} guards these waters.`}</p>

function bossVictory(id) {
  const B = BOSSES[id], first = !bossBeaten(id);
  S.bosses[id] = (S.bosses[id] || 0) + 1;
  if (B.kraken) { S.kraken = true; const d = dexEntry('kraken'); d.n++; d.rar[5] = 1; S.basket.push({ id: S.nextId++, sp: 'kraken', w: 0, r: 5, v: 0, t: Date.now() }); }
  const xp = gainXP(first ? B.xp : Math.round(B.xp * 0.25));
  const coins = first ? B.coins : Math.round(B.coins * 0.3); if (coins) addMoney(coins);
  const tre = []; for (let i = 0; i < (first ? B.tre : 1); i++) { const tr = rollTreasure(B.area); tre.push(tr); S.treasures.push(tr); S.treDex[tr.tid] = S.treDex[tr.tid] || { n: 0, don: false }; S.treDex[tr.tid].n++; S.stats.treasures++; }
  let tal = null; if (first) { const un = talismansInArea(B.area).filter(T => !S.talismans.includes(T.id)); if (un.length) { tal = un.sort((a, b) => b.r - a.r)[0]; S.talismans.push(tal.id); S.talNew = true; } }
  questTick(); save(true);
  openPanel('victory', '🏆 ' + (first ? `${B.name.toUpperCase()} IS DEFEATED!` : 'Victory again!'), () => `
    <div class="center victory"><div class="rays"></div>
     <p class="big-p">${B.kraken ? (first ? 'From a broken rod on a poor beach to the slayer of the Kraken. The fish are returning to every sea!' : 'The Kraken retreats once more.') : first ? `${esc(B.name)} sinks back into the deep. ${esc(AREAS[B.area].sea)} is safe!` : `${esc(B.name)} retreats.`}</p>

     ${B.kraken ? `<table class="tt wide"><tr><td>Attempts</td><td>${S.krakenTries}</td></tr><tr><td>Level</td><td>${S.level}</td></tr><tr><td>Fish caught</td><td>${S.stats.caught}</td></tr><tr><td>Species discovered</td><td>${dexCount()}/${SPECIES.length}</td></tr><tr><td>Talismans</td><td>${S.talismans.length}/${TALISMANS.length}</td></tr><tr><td>Time played</td><td>${fmtTime(S.play)}</td></tr></table>` : ''}
     <button class="btn gold big" data-act="victorydone">Continue</button></div>`, { cls: 'narrow', noClose: true });
}

// ---------------- map card ----------------
function openMapCard(i, pin) {
  const a = AREAS[i], st = areaState(i), el = $('#mapcard');
  const here = S.loc.type === 'sea' && S.loc.area === i;
  let body;
  if (st === 'next') {
    const r = permitReqs(i);
    body = `<div class="mc-desc">${esc(a.desc)}</div><div class="warn">🔒 You need a permit from the Town Hall.</div>
      <div class="reqs col">${reqTag(r.species, `Catch all species in ${AREAS[i - 1].sea} (${areaFound(i - 1)}/5)`)}${r.prevBoss ? reqTag(r.boss, `Defeat ${r.prevBoss.name}`) : ''}${reqTag(r.level, `Player level ${a.permitLvl}`)}${reqTag(r.money, 'Permit cost ' + coinHTML(a.permitCost))}</div>`;

    const found = speciesInArea(i).map(s => `<canvas width="40" height="24" data-sp="${s.id}" ${S.dex[s.id] ? '' : 'data-sil="1"'}></canvas>`).join('');

    body = `<div class="mc-desc">${esc(a.desc)}</div><div class="mc-feat">✨ ${esc(FEATURES[i].text)}</div><div class="mc-fish">${found}</div><div class="mc-stats">Species: <b>${areaFound(i)}/5</b>${tl}${mid ? ' · <span class="warnc">🆘 Someone is stranded here!</span>' : ''}${boss ? ` · ${bossBeaten(boss.id) ? '✔' : '☠️'} ${esc(boss.name)}` : ''}</div>
      <div class="row gap">${i === 0 ? `<button class="btn ${S.loc.type === 'village' ? '' : 'gold'}" data-act="travel" data-area="0" data-mode="dock">🏠 ${S.loc.type === 'village' ? 'Stay in the village' : 'Dock at the village'}</button>` : ''}

  if (qt) { const wantDock = qt.village || qt.bld || (qt.rescue && S.aboard === qt.rescue); el.querySelectorAll(`[data-mode="${wantDock ? 'dock' : 'fish'}"]`).forEach(b => b.classList.add('qarrow')); }

// ---------------- hotbar (gadgets & abilities) ----------------
function updateHotbar(hide) {
  const hb = $('#hotbar'); if (!hb) return;
  if (hide || !S || !(sceneName === 'sea' || sceneName === 'boss')) { hb.classList.add('hidden'); return; }
  const fighting = sceneName === 'boss' ? Scenes.boss.state === 'fight' : Scenes.sea.state === 'fishing';
  const btns = [];
  const g = mods();
  if (fighting) {
    if (S.gadgets.stun !== undefined && (GADGET_BY_ID.stun && merchantLv('fizz') >= 2)) btns.push(`<button class="hbtn" data-act="usegadget" data-id="stun" ${hasGadget('stun') ? '' : 'disabled'}><span class="hk">1</span>⚡<span class="hn">Stun ×${S.gadgets.stun || 0}</span></button>`);
    if (g.focus) { const F = sceneName === 'boss' ? Scenes.boss.F : Scenes.sea.fight && Scenes.sea.fight.F; btns.push(`<button class="hbtn" data-act="usefocus" ${F && F.focusUsed ? 'disabled' : ''}><span class="hk">2</span>🌀<span class="hn">Focus</span></button>`); }
  } else if (sceneName === 'sea') {
    ['horn', 'repair', 'bait'].forEach(id => { const G = GADGET_BY_ID[id]; if (merchantLv('fizz') >= G.lv && S.gadgets[id] !== undefined) btns.push(`<button class="hbtn" data-act="usegadget" data-id="${id}" ${hasGadget(id) ? '' : 'disabled'}><span class="hk">${G.key}</span>${{ horn: '📯', repair: '🔧', bait: '🪱' }[id]}<span class="hn">${G.n.split(' ')[0]} ×${S.gadgets[id] || 0}</span></button>`); });
    if (S.modules.motor) btns.push(`<button class="hbtn boost" id="boostBtn"><span class="hk">⇧</span>🚀<span class="hn">Boost</span></button>`);
    if (S.baitCasts > 0) btns.push(`<span class="hinfo">🪱 ${S.baitCasts} lucky casts</span>`);
  }
  hb.innerHTML = btns.join('');
  hb.classList.toggle('hidden', !btns.length);
  hb.classList.toggle('fight', fighting);
  const side = isTouch || H < 560;
  hb.classList.toggle('side', side);
  if (fighting) { const r = sceneName === 'boss' ? Scenes.boss.barRect() : Scenes.sea.barRect(); if (side) { hb.style.top = Math.max(70, r.y - 60) + 'px'; hb.style.bottom = 'auto'; } else { hb.style.top = (sceneName === 'boss' ? r.y - 112 : Math.min(H - 64, r.y + 120)) + 'px'; hb.style.bottom = 'auto'; } }
  else { hb.style.top = ''; hb.style.bottom = ''; }
  const bb = $('#boostBtn');
  if (bb) { bb.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); touchBoost = true; bb.classList.add('on'); }); ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => bb.addEventListener(ev, () => { touchBoost = false; bb.classList.remove('on'); })); }
}

function resChips(req) {
  if (!req) return '';
  return Object.keys(req).map(k => { const have = resCount(k), need = req[k]; return `<span class="reschip ${have >= need ? 'ok' : 'no'}"><canvas width="26" height="26" data-res="${k}"></canvas>${have}/${need}</span>`; }).join('');
}
function costLine(coins, req, extra = '') {
  return `<div class="costline">${coins ? `<span class="reschip ${S.money >= coins ? 'ok' : 'no'}">${coinHTML(coins)}</span>` : ''}${resChips(req)}${extra}</div>`;
}
function reqTag(ok, txt) { return `<span class="req ${ok ? 'ok' : 'no'}">${ok ? '✔' : '✖'} ${txt}</span>`; }
function stars(L, max) { return `<span class="stars">${'★'.repeat(L)}<span class="dim">${'★'.repeat(Math.max(0, max - L))}</span></span>`; }

// shared merchant header with upgrade section
function shopHead(owner) {
  const M = MERCHANTS[owner], L = S.merchants[owner];
  let up = '';
  if (L < M.maxLv) {
    const c = merchantUpgradeCost(owner, L + 1), vOk = S.village >= c.village;
    const ok = vOk && S.money >= c.coins && hasRes(c.res);
    up = `<div class="upgrade"><div class="up-title">Upgrade to level ${L + 1}: <span class="up">${esc(M.next(L))}</span></div>
      ${costLine(c.coins, c.res, reqTag(vOk, `Village Lv ${c.village}`))}
      <button class="btn gold small" data-act="upgm" data-id="${owner}" ${ok ? '' : 'disabled'}>⬆ Upgrade</button></div>`;
  } else up = `<div class="upgrade max">⭐ Fully upgraded!</div>`;
  return `<div class="shophead"><canvas class="pcanvas" data-look="${M.look}" width="80" height="80"></canvas>
    <div class="sh-main"><div class="sh-name">${esc(M.name)} ${stars(L, M.maxLv)}</div><div class="sh-perk">${esc(M.perk(L))}</div></div></div>${up}`;
}
function openBuilding(id) {
  sfx('click');
  const B = BUILDINGS.find(b => b.id === id);
  if (id === 'boat') return setSail();
  if (id === 'driftwood') return searchDriftwood();
  if (id === 'townhall') {
    if (!S.flags.metElder) return say('Elder Wren', 'elder', LINES.elderIntro, () => { S.flags.metElder = true; questTick(); save(true); });
    return openTownHall();
  }
  const owner = B.owner;
  if (!S.merchants[owner]) {
    const M = MERCHANTS[owner], A = AREAS[M.area], known = areaState(M.area) !== 'hidden';
    return say('', null, [`An empty plot. Folk say the ${M.shop.toLowerCase()} owner was lost at sea when the Kraken’s storm hit${known ? ` — last seen near ${A.sea}` : ''}.`, known ? 'Find them, rescue them, and bring them home!' : 'Maybe you’ll find them once you can sail further.']);
  }
  ({ market: openMarket, shrine: openShrine, boatyard: openBoatyard, forge: openForge, museum: openMuseum, boutique: openBoutique, workshop: openWorkshop })[id]();
}
function searchDriftwood() {
  if (S.hasRod) { toast('Just soggy driftwood now.'); return; }
  say('', null, LINES.driftwood, () => {
    ['rod', 'reel', 'hook'].forEach(k => { if (!S.parts[k].includes(0)) S.parts[k].push(0); });
    S.eq = { rod: 0, reel: 0, hook: 0 }; S.hasRod = true;
    itemReveal('Broken Fishing Rod', 'A cracked branch rod, a rusty spool and a bent nail. It’s weak, slow and barely holds a fish — but it’s a start!', (c, w, h, t) => drawRodPreview({ getContext: () => c, width: w, height: h }, { rod: 0, reel: 0, hook: 0 }, t), () => { questTick(); save(true); });
  });
}

// ---------------- Parts shops (Tackle Hut & Forge) ----------------
function partRows(tab, seller) {
  const P = PARTS[tab], owned = S.parts[tab], rows = [];
  const range = [0, 10];
  let shownLocked = 0;
  for (let t = range[0]; t <= range[1]; t++) {
    const has = owned.includes(t), eq = S.eq[tab] === t, ps = partSeller(t), sold = t > 0 && ps.m === seller;
    if (!has && !sold) continue;
    if (t === 0 && !has) continue;
    const mOk = merchantLv(seller) >= ps.lv, lOk = S.level >= PART_LVL[t], cost = PART_COST[t];
    let act;
    if (eq) act = `<span class="badge eq">Equipped</span>`;
    else if (has) act = `<button class="btn small" data-act="equip" data-kind="${tab}" data-tier="${t}">Equip</button>`;
    else if (mOk && lOk) act = `<button class="btn gold small" data-act="buypart" data-kind="${tab}" data-tier="${t}" ${S.money < cost ? 'disabled' : ''}>${seller === 'greta' ? 'Forge' : 'Buy'} ${coinHTML(cost)}</button>`;
    else { if (shownLocked >= 1) { rows.push(`<div class="partrow locked more">🔒 More parts will appear as you level up and upgrade ${MERCHANTS[seller].name}’s shop.</div>`); break; } shownLocked++; act = `<span class="badge lock">🔒 ${!lOk ? 'Player Lv ' + PART_LVL[t] : ''}${!lOk && !mOk ? ' · ' : ''}${!mOk ? MERCHANTS[seller].name + ' Lv ' + ps.lv : ''}</span>`; }
    rows.push(`<div class="partrow ${eq ? 'is-eq' : ''} ${!has && !(mOk && lOk) ? 'locked' : ''}" data-prev-kind="${tab}" data-prev-tier="${t}">
      <canvas width="70" height="44" data-part="${tab}" data-tier="${t}"></canvas>
      <div class="pr-main"><div class="pr-name">${esc(P.names[t])} <span class="tierchip" style="background:${TIER_COL[Math.max(1, t)]}">T${t}</span></div><div class="pr-stat">${partStatText(tab, t)}</div></div>${act}</div>`);
  }
  return rows.join('');
}

const cv = $('#game'), ctx = cv.getContext('2d');
let W = innerWidth, H = innerHeight, DPR = 1;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1); W = innerWidth; H = innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize); resize();

cv.addEventListener('pointerdown', e => {
  ac();
  if (e.pointerType === 'touch') isTouch = true;
  ptr.type = e.pointerType; ptr.x = e.clientX; ptr.y = e.clientY; ptr.down = true; ptr.moved = performance.now(); ptr.onPad = false;
  if (DLG) { advanceDialog(); return; }
  if (scene && scene.click && !fade.dir) scene.click(e.clientX, e.clientY);
});
window.addEventListener('pointermove', e => { ptr.x = e.clientX; ptr.y = e.clientY; ptr.moved = performance.now(); if (e.pointerType) ptr.type = e.pointerType; });
window.addEventListener('pointerup', () => { ptr.down = false; if (Scenes.sea) Scenes.sea.dragSteer = false; });
window.addEventListener('contextmenu', e => { if (e.target === cv) e.preventDefault(); });

let lastT = performance.now(), autoT = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  try {
    if (scene) { scene.update(dt); ctx.clearRect(0, 0, W, H); scene.draw(); }
    if (fade.dir === 1) { fade.a += dt * 3.5; if (fade.a >= 1) { fade.a = 1; fade.dir = -1; const cb = fade.cb; fade.cb = null; cb && cb(); } }
    else if (fade.dir === -1) { fade.a -= dt * 2.6; if (fade.a <= 0) { fade.a = 0; fade.dir = 0; } }
    if (fade.a > 0) { ctx.fillStyle = `rgba(3,10,20,${fade.a})`; ctx.fillRect(0, 0, W, H); }
    tickDialog(dt);
    if (PANEL && PANEL.anim) PANEL.anim(dt);
    if (S && sceneName && sceneName !== 'menu') {
      S.play += dt; autoT += dt;
      if (autoT > 20) { autoT = 0; save(true); }
      domQuestArrows();
      if (sceneName === 'sea' || sceneName === 'map') updateWeight();
    }
  } catch (err) { console.error(err); }

}
