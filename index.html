<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b2238">
<title>Fishing Rise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%231f7fae'/%3E%3Cpath d='M14 34c8-10 22-10 30 0-8 10-22 10-30 0z' fill='%23ffcf4a'/%3E%3Cpath d='M44 34l10-8v16z' fill='%23ffcf4a'/%3E%3Ccircle cx='21' cy='32' r='2.5' fill='%23123'/%3E%3C/svg%3E">
<style>
:root{--bg:#06121f;--panel:#10263d;--panel2:#16334f;--edge:#3c6f9c;--txt:#eaf5ff;--muted:#93b4cf;--accent:#46d7cf;--gold:#ffcf4a;--danger:#ff5a5a;--ok:#5fe07a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:'Fredoka','Trebuchet MS',system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#game{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none}
#ui{position:fixed;inset:0;pointer-events:none;z-index:5}
.hidden{display:none!important}
button{font-family:inherit}
.btn{position:relative;font:inherit;font-weight:600;font-size:15px;cursor:pointer;border:none;border-radius:12px;padding:9px 15px;background:linear-gradient(#3f86de,#2a5ea8);color:#fff;box-shadow:0 4px 0 #1b3f73,0 6px 14px rgba(0,0,0,.3);transition:transform .08s,filter .15s,box-shadow .08s;pointer-events:auto;white-space:nowrap}
.btn:hover{filter:brightness(1.12)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #1b3f73}
.btn.gold{background:linear-gradient(#ffd864,#e8a91b);color:#4a2b00;box-shadow:0 4px 0 #9a6a00,0 6px 14px rgba(0,0,0,.3)}
.btn.green{background:linear-gradient(#5fe07a,#2fa84a);color:#08310f;box-shadow:0 4px 0 #1f6a30,0 6px 14px rgba(0,0,0,.3)}
.btn.red{background:linear-gradient(#ff6a6a,#c83a3a);box-shadow:0 4px 0 #7a1f1f,0 6px 14px rgba(0,0,0,.3)}
.btn.ghost{background:rgba(255,255,255,.08);box-shadow:none;border:1px solid rgba(255,255,255,.2)}
.btn.big{font-size:19px;padding:12px 22px}
.btn.small{font-size:13px;padding:6px 10px;border-radius:9px}
.btn:disabled{filter:grayscale(.85) brightness(.7);cursor:not-allowed}
.iconbtn{width:46px;height:46px;padding:0;font-size:22px;display:flex;align-items:center;justify-content:center}
.iconbtn.small{width:34px;height:34px;font-size:16px}
#basketCount{position:absolute;top:-6px;right:-6px;background:#ff5a5a;color:#fff;font-size:11px;border-radius:10px;padding:1px 6px;min-width:18px}
#basketCount:empty{display:none}
.coin{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;margin:0 1px 0 3px;box-shadow:inset -2px -2px 0 rgba(0,0,0,.25),inset 2px 2px 0 rgba(255,255,255,.45),0 0 0 1px rgba(0,0,0,.25)}
.coin.b{background:#c67c3c}.coin.s{background:#d7dee5}.coin.g{background:#f6c636}.coin.p{background:linear-gradient(135deg,#f4fbff,#9fd3ff,#e9f6ff,#7ab8ff);box-shadow:inset -2px -2px 0 rgba(0,0,0,.2),0 0 8px #9fd3ff}
.coins{white-space:nowrap;font-weight:600}
.flycoin{position:fixed;z-index:50;width:18px;height:18px;transition:left .65s cubic-bezier(.4,0,.2,1),top .65s cubic-bezier(.6,-0.3,.4,1),transform .65s,opacity .65s;pointer-events:none}
/* HUD */
#hud{position:absolute;inset:0}
#questbox{position:absolute;left:12px;top:12px;max-width:min(330px,calc(100vw - 260px));min-width:200px;background:rgba(10,30,50,.86);border:2px solid #f0c24a;border-radius:14px;padding:8px 12px;pointer-events:auto;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.35)}
#questbox .qlabel{font-size:11px;letter-spacing:.12em;color:var(--gold);text-transform:uppercase}
#questbox .qtitle{font-weight:700;font-size:16px}
#questbox .qtext{font-size:13px;color:#cfe3f5;margin-top:2px;line-height:1.3}
#questbox.flash{animation:qflash 1s}
@keyframes qflash{0%{transform:scale(1)}20%{transform:scale(1.08);box-shadow:0 0 30px #ffd23a}100%{transform:scale(1)}}
#topright{position:absolute;right:12px;top:12px;display:flex;gap:8px;align-items:center;pointer-events:auto}
#coins{position:relative;background:rgba(10,30,50,.86);border:2px solid var(--edge);border-radius:12px;padding:7px 10px;font-weight:700;font-size:16px;display:flex;gap:8px;align-items:center}
#coins .cv{white-space:nowrap}
#coins.pulse{animation:cpulse .5s}
@keyframes cpulse{50%{transform:scale(1.1);border-color:var(--gold)}}
.moneyfloat{position:absolute;right:6px;top:100%;font-size:15px;color:#9effb0;animation:mfloat 1.4s forwards;white-space:nowrap;text-shadow:0 2px 3px #000}
.moneyfloat.neg{color:#ff9a9a}
@keyframes mfloat{from{transform:translateY(0);opacity:1}to{transform:translateY(26px);opacity:0}}
#locname{position:absolute;left:50%;top:14px;transform:translateX(-50%);font-weight:700;font-size:17px;text-shadow:0 2px 4px #000;background:rgba(0,0,0,.3);padding:4px 14px;border-radius:20px;white-space:nowrap}
#locname:empty{display:none}
@media (max-width:900px){#locname{top:auto;bottom:76px;font-size:14px}}
.tierchip{display:inline-block;color:#0b1a2a;font-size:11px;font-weight:700;padding:1px 7px;border-radius:9px;vertical-align:2px}
#bottombar{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:10px;align-items:center;pointer-events:auto;flex-wrap:wrap;justify-content:center;width:max-content;max-width:96vw}
#weight{background:rgba(10,30,50,.86);border:2px solid var(--edge);border-radius:12px;padding:6px 12px;display:flex;align-items:center;gap:8px;font-size:13px}
.wbar{width:130px;height:12px;background:rgba(0,0,0,.4);border-radius:6px;overflow:hidden}
.wfill{height:100%;width:0;background:var(--ok);transition:width .3s,background .3s}
.qarrow{animation:qglow 1s infinite}
.qarrow::before{content:'\2B07';position:absolute;left:50%;top:-34px;transform:translateX(-50%);font-size:26px;color:var(--gold);text-shadow:0 2px 4px #000,0 0 10px #ffd23a;animation:bob .7s infinite alternate;pointer-events:none}
@keyframes bob{to{top:-24px}}
@keyframes qglow{50%{box-shadow:0 0 0 3px #ffd23a,0 0 22px #ffd23a}}
/* touch pad */
#fishpad{position:absolute;left:0;right:0;bottom:24px;display:flex;justify-content:space-between;padding:0 20px}
.padbtn{pointer-events:auto;width:86px;height:86px;border-radius:50%;border:3px solid rgba(255,255,255,.5);background:rgba(20,60,100,.55);color:#fff;font-size:34px;touch-action:none}
.padbtn.on{background:rgba(90,220,140,.6)}
/* toasts / banner */
#toasts{position:absolute;top:74px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;width:max-content;max-width:92vw}
.toast{background:rgba(10,30,50,.94);border:2px solid var(--edge);padding:7px 14px;border-radius:12px;font-size:14px;animation:tin .3s ease-out,tout .4s 2.8s forwards;box-shadow:0 6px 16px rgba(0,0,0,.4);text-align:center}
.toast.quest{border-color:var(--gold)}.toast.money{border-color:var(--ok)}.toast.warn{border-color:var(--danger)}.toast.save{border-color:var(--accent)}
@keyframes tin{from{transform:translateY(-20px) scale(.9);opacity:0}}
@keyframes tout{to{transform:translateY(-10px);opacity:0}}
#banner{position:absolute;top:30%;left:0;right:0;text-align:center;pointer-events:none}
#banner.show{animation:bannerIn 3.6s forwards}
#banner .btitle{font-size:clamp(30px,6vw,58px);font-weight:700;text-shadow:0 4px 0 rgba(0,0,0,.5),0 0 30px rgba(0,0,0,.6);letter-spacing:.03em}
#banner .bsub{font-size:clamp(14px,2.2vw,20px);margin-top:6px;text-shadow:0 2px 4px #000}
@keyframes bannerIn{0%{opacity:0;transform:scale(.6)}12%{opacity:1;transform:scale(1.06)}20%{transform:scale(1)}82%{opacity:1}100%{opacity:0;transform:translateY(-20px)}}
/* dialog */
#dialog{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);width:min(720px,95vw);background:linear-gradient(#173a5c,#0e2640);border:2px solid #5a8fc0;border-radius:16px;padding:12px 16px;display:flex;gap:14px;align-items:flex-start;pointer-events:auto;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:tin .2s}
#portrait{flex:none;width:76px;height:76px}
.dbody{flex:1;min-height:76px;display:flex;flex-direction:column}
.dname{font-weight:700;color:var(--gold);font-size:17px}
.dtext{font-size:17px;line-height:1.4;flex:1;margin-top:2px}
.dhint{align-self:flex-end;font-size:12px;color:var(--muted);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.3}}
/* modal / panel */
#modal{position:absolute;inset:0;background:rgba(3,10,20,.6);display:flex;align-items:center;justify-content:center;pointer-events:auto;animation:fin .2s;padding:10px}
@keyframes fin{from{opacity:0}}
.panel{width:min(760px,96vw);max-height:92vh;display:flex;flex-direction:column;background:linear-gradient(#153555,#0d2238);border:2px solid var(--edge);border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.6);animation:pop .28s cubic-bezier(.2,1.4,.4,1);overflow:hidden}
.panel.wide{width:min(900px,96vw)}.panel.narrow{width:min(540px,96vw)}
@keyframes pop{from{transform:scale(.8);opacity:0}}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid #2b5679;font-size:21px;font-weight:700;background:rgba(0,0,0,.15)}
.panel-body{overflow:auto;padding:14px 16px;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.panel-body canvas{max-width:100%}
.row{display:flex;align-items:center;flex-wrap:wrap}.gap{gap:10px}.center{justify-content:center;text-align:center}
.muted{color:var(--muted)}.small{font-size:12px}
.hint{color:var(--muted);font-size:13px;margin:8px 0}
.warn{background:rgba(255,90,90,.15);border:1px solid rgba(255,90,90,.5);color:#ffc0c0;padding:7px 10px;border-radius:10px;margin:8px 0;font-size:14px}
.warnc{color:#ffb08a}.up{color:#8affb0}
.empty{text-align:center;color:var(--muted);padding:30px}
.sect{font-weight:700;color:var(--gold);margin:14px 0 6px;font-size:16px}
.menu-col{display:flex;flex-direction:column;gap:12px;align-items:stretch}
.shopkeep{display:flex;gap:12px;align-items:center;background:rgba(0,0,0,.2);border-radius:14px;padding:8px 12px;margin-bottom:10px}
.pcanvas{flex:none;width:64px;height:64px}
.sk-text{font-size:15px;line-height:1.35}
.card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px}
.card-title{font-weight:700;font-size:17px}.card-sub{color:var(--muted);font-size:14px}
.card-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.big-card canvas{width:100%;border-radius:10px}
.statline{font-size:13px;color:#cfe3f5;margin-top:4px}
.next{font-size:14px;margin:4px 0 6px}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
@media (max-width:620px){.twocol{grid-template-columns:1fr}}
#shipCv,#smithCv{width:100%;border-radius:12px;display:block}
/* fish list */
.basket-sum{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-weight:600;margin-top:8px}
.fishlist{display:flex;flex-direction:column;gap:6px}
.fishrow{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-left:4px solid #c3ced6;border-radius:10px;padding:5px 10px;transition:background .15s,transform .15s}
.fishrow:hover{background:rgba(255,255,255,.12);transform:translateX(3px)}
.fishrow.r1{border-left-color:#5fd36c}.fishrow.r2{border-left-color:#4aa8ff}.fishrow.r3{border-left-color:#b46dff}.fishrow.r4{border-left-color:#ffb52e;box-shadow:inset 0 0 18px rgba(255,181,46,.15)}.fishrow.r5{border-left-color:#ff4f7f;box-shadow:inset 0 0 18px rgba(255,79,127,.2)}
.fishrow canvas{width:66px;height:40px;flex:none;pointer-events:none}
.fr-main{flex:1;min-width:0}.fr-name{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fr-meta{font-size:12px;color:var(--muted)}
.fr-val{font-weight:600;white-space:nowrap}
.rchip{display:inline-block;color:#0b1a2a;font-weight:700;font-size:11px;padding:0 6px;border-radius:8px}
/* tooltip */
#tooltip{position:fixed;z-index:60;background:#0b1d30;border:2px solid var(--gold);border-radius:12px;padding:9px 12px;min-width:210px;box-shadow:0 10px 24px rgba(0,0,0,.6);pointer-events:none;font-size:14px}
.tt-name{font-weight:700;font-size:16px}.tt-sub{font-size:12px;color:var(--muted);margin-bottom:5px}
table.tt{border-collapse:collapse;width:100%}table.tt td{padding:2px 4px}table.tt td:last-child{text-align:right;font-weight:600}
table.tt.wide{max-width:360px;margin:10px auto;background:rgba(0,0,0,.2);border-radius:10px}
.tt-final td{border-top:1px solid rgba(255,255,255,.25);padding-top:5px;color:var(--gold)}
/* tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 4px}
.tabs.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}
.tab{font:inherit;font-weight:600;cursor:pointer;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#cfe3f5;padding:6px 14px;border-radius:20px;white-space:nowrap}
.tab.on{background:var(--gold);color:#4a2b00;border-color:var(--gold)}
/* blacksmith */
.smith-top{display:grid;grid-template-columns:1.6fr 1fr;gap:12px;align-items:center}
@media (max-width:620px){.smith-top{grid-template-columns:1fr}}
.eqlist{display:flex;flex-direction:column;gap:5px;font-size:14px;background:rgba(0,0,0,.2);border-radius:12px;padding:10px}
.partlist{display:flex;flex-direction:column;gap:6px}
.partrow{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:5px 10px}
.partrow.is-eq{border-color:var(--ok);background:rgba(95,224,122,.1)}
.partrow.locked{opacity:.5}
.partrow canvas{width:70px;height:44px;flex:none}
.pr-main{flex:1;min-width:0}.pr-name{font-weight:700}.pr-stat{font-size:12px;color:var(--muted)}
.badge{font-size:12px;font-weight:700;padding:4px 9px;border-radius:9px;white-space:nowrap}
.badge.eq{background:var(--ok);color:#08310f}.badge.lock{background:rgba(255,255,255,.08);color:var(--muted)}
/* bestiary */
.dexgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:8px}
.dexcard{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:8px;text-align:center;position:relative}
.dexcard canvas{width:120px;height:70px}
.dexcard.unk{opacity:.7}.dexcard.don{border-color:var(--gold)}
.dx-name{font-weight:700}.dx-meta{font-size:11px;color:var(--muted)}
.dx-dots{display:flex;justify-content:center;gap:4px;margin:4px 0}
.rdot{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.12);display:inline-block}
.dx-don{position:absolute;top:6px;right:8px;font-size:11px;color:var(--gold);font-weight:700}
/* catch & reveal */
.catch,.reveal,.victory{position:relative;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;overflow:hidden}
.catch canvas,.reveal canvas{width:100%;max-width:420px;position:relative;z-index:1}
.rays{-webkit-mask-image:radial-gradient(circle,#000 15%,transparent 62%);mask-image:radial-gradient(circle,#000 15%,transparent 62%);position:absolute;left:50%;top:110px;width:700px;height:700px;margin:-350px 0 0 -350px;background:repeating-conic-gradient(rgba(255,224,138,.16) 0 10deg,transparent 10deg 20deg);animation:spin 12s linear infinite;border-radius:50%;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
.newtag{position:absolute;top:8px;right:10px;z-index:2;background:linear-gradient(#ff6a8a,#e0305a);color:#fff;font-weight:700;font-size:22px;padding:4px 14px;border-radius:12px;transform:rotate(8deg);animation:newpop .6s cubic-bezier(.2,1.8,.4,1),wiggle 1.5s .6s infinite;box-shadow:0 4px 14px rgba(255,60,100,.5)}
@keyframes newpop{from{transform:scale(0) rotate(-40deg)}}
@keyframes wiggle{50%{transform:rotate(-4deg) scale(1.08)}}
.c-name,.rv-title{font-size:28px;font-weight:700;position:relative;z-index:1;text-shadow:0 3px 0 rgba(0,0,0,.4)}
.c-meta,.c-calc,.rv-desc{position:relative;z-index:1;font-size:15px}
.c-calc{background:rgba(0,0,0,.25);padding:6px 12px;border-radius:10px}
.catch .btn,.reveal .btn,.victory .btn{position:relative;z-index:1;margin-top:8px}
.catch.r4 .c-name,.catch.r5 .c-name{animation:shine 1.2s infinite alternate}
@keyframes shine{to{filter:brightness(1.4) drop-shadow(0 0 10px currentColor)}}
.big-p{font-size:18px;margin:8px 0}
textarea#codebox{width:100%;height:120px;background:#06121f;color:#9fd3ff;border:1px solid var(--edge);border-radius:10px;padding:8px;font-family:monospace;font-size:11px;margin:10px 0;user-select:text;-webkit-user-select:text}
/* quest log / howto / patch */
.qlog{display:flex;flex-direction:column;gap:6px}
.ql{padding:6px 10px;border-radius:9px;background:rgba(255,255,255,.04);font-size:14px}
.ql.done{color:#8affb0}.ql.cur{border:1px solid var(--gold);background:rgba(255,207,74,.08)}.ql.fut{color:var(--muted)}
.howto h3{color:var(--gold);margin:12px 0 4px;font-size:16px}.howto p{font-size:14px;line-height:1.45;margin-bottom:4px}
.patch{margin-bottom:14px}.p-title{font-weight:700;font-size:17px;color:var(--gold);margin:2px 0 6px}
.patch ul{padding-left:20px}.patch li{font-size:14px;line-height:1.4;margin-bottom:4px}
/* slots */
.slots{display:flex;flex-direction:column;gap:10px}
.slot{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:5px}
.slot.empty{opacity:.85}.sl-name{font-weight:700;font-size:16px}
/* map card */
#mapcard{position:absolute;right:14px;bottom:76px;width:min(360px,94vw);background:rgba(10,28,48,.95);border:2px solid var(--edge);border-radius:16px;padding:12px 14px;pointer-events:auto;box-shadow:0 10px 30px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:8px}
#mapcard.pop{animation:pop .25s cubic-bezier(.2,1.4,.4,1)}
.mc-head{display:flex;align-items:center;gap:8px}.mc-name{font-weight:700;font-size:19px;flex:1}
.mc-desc{font-size:14px;color:#cfe3f5;line-height:1.35}.mc-stats{font-size:13px;color:var(--muted)}
#mapcard .btn{margin-top:6px}
@media (max-width:620px){#mapcard{left:50%;right:auto;transform:translateX(-50%);bottom:70px}}
/* main menu */
#menu{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;pointer-events:auto;padding:16px}
#menu .menu-col{width:min(300px,86vw)}
.logo{text-align:center;animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.logo-top,.logo-bot{font-weight:700;line-height:.9;letter-spacing:.06em;background:linear-gradient(#fff6c8,#ffcf4a 55%,#e88a1b);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #5a2a00) drop-shadow(0 10px 20px rgba(0,0,0,.5))}
.logo-top{font-size:clamp(40px,8vw,78px)}.logo-bot{font-size:clamp(54px,11vw,110px)}
.logo-sub{margin-top:8px;font-size:clamp(14px,2vw,18px);color:#fff;text-shadow:0 2px 6px #000}
#menuver{position:absolute;bottom:10px;right:14px;font-size:13px;color:rgba(255,255,255,.7);text-shadow:0 1px 3px #000}
@media (max-height:560px){#menu{flex-direction:row;gap:30px}.logo-top{font-size:44px}.logo-bot{font-size:60px}}

.victory .rays{opacity:.45}
.victory table.tt td:first-child{text-align:left}
#hud.fishing #bottombar,#hud.fishing #locname{display:none}
#fishpad{bottom:max(14px,env(safe-area-inset-bottom))}
@media (max-height:520px){
  #locname{display:none}

// ---------------- Fishing core (shared by game + tests) ----------------
function fishAI(d) {
  return {
    speed: 0.2 + 0.088 * d,
    decMin: Math.max(0.2, 1.1 - 0.09 * d),
    decMax: Math.max(0.45, 2.0 - 0.15 * d),
    dart: Math.min(0.55, 0.03 + 0.045 * d),
    pause: Math.max(0.05, 0.3 - 0.025 * d),
    jump: Math.min(0.9, 0.3 + 0.065 * d),
    smart: Math.min(0.6, Math.max(0, (d - 3) * 0.08))
  };
}
function newFight(sp, rar, gear, easy) {
  const d = easy ? 0.3 : sp.tier + rar * 0.45 + (sp.agile - 1) * 2;
  const tierGap = sp.tier - gear.power;
  const fillMult = Math.max(0.3, Math.min(1.35, 1 + 0.2 * (gear.power - sp.tier))) / (1 + 0.04 * rar);
  const drain = 0.2 * (1 + 0.05 * sp.tier) * (1 - gear.grip) * (1 + 0.1 * Math.max(0, tierGap));
  return {
    d, ai: fishAI(d), gear, fill: gear.fill * fillMult * (easy ? 1.6 : 1), drain: drain * (easy ? 0.5 : 1),
    fx: 0.5, fv: 0, tgt: 0.5, ft: 0.6, mode: 'swim',
    cur: 0.5, cv: 0, prog: 0.3 + gear.grip * 0.4, time: 0, over: false, result: null
  };
}
function moveFish(F, dt) {
  const ai = F.ai;
  F.ft -= dt;
  if (F.ft <= 0) {
    const r = Math.random();
    if (r < ai.pause) { F.mode = 'pause'; F.ft = 0.25 + Math.random() * 0.45; }
    else {
      F.mode = Math.random() < ai.dart ? 'dart' : 'swim';
      let tgt;
      if (Math.random() < ai.smart) {
        const away = F.fx >= F.cur ? 1 : -1;
        tgt = F.fx + away * (0.15 + Math.random() * ai.jump);
        if (tgt > 0.96 || tgt < 0.04) tgt = F.fx - away * (0.2 + Math.random() * ai.jump);
      } else tgt = F.fx + (Math.random() * 2 - 1) * ai.jump;
      F.tgt = Math.max(0.04, Math.min(0.96, tgt));
      F.ft = (ai.decMin + Math.random() * (ai.decMax - ai.decMin)) * (F.mode === 'dart' ? 0.55 : 1);
    }
  }
  const spd = F.mode === 'pause' ? 0 : ai.speed * (F.mode === 'dart' ? 2.3 : 1);
  const diff = F.tgt - F.fx;
  const desired = Math.sign(diff) * Math.min(spd, Math.abs(diff) * 6);
  F.fv += (desired - F.fv) * Math.min(1, dt * 8);
  F.fx += F.fv * dt;
  if (F.fx < 0.02) { F.fx = 0.02; F.fv = Math.abs(F.fv); }
  if (F.fx > 0.98) { F.fx = 0.98; F.fv = -Math.abs(F.fv); }
}
// input: {dir: -1|0|1, target: null|0..1}
function moveCursor(F, dt, input) {
  const maxS = F.gear.speed;
  let desired = 0;
  if (input.dir) desired = input.dir * maxS;
  else if (input.target != null) desired = Math.max(-maxS, Math.min(maxS, (input.target - F.cur) * 9));
  F.cv += (desired - F.cv) * Math.min(1, dt * 10);
  F.cur += F.cv * dt;
  const hw = F.gear.width / 2;
  if (F.cur < hw) { F.cur = hw; F.cv = 0; }
  if (F.cur > 1 - hw) { F.cur = 1 - hw; F.cv = 0; }
}
function stepFight(F, dt, input) {
  if (F.result) return;
  F.time += dt;
  moveFish(F, dt);
  moveCursor(F, dt, input);
  F.over = Math.abs(F.fx - F.cur) <= F.gear.width / 2;
  F.prog += (F.over ? F.fill : -F.drain) * dt;
  if (F.prog >= 1) { F.prog = 1; F.result = 'win'; }
  if (F.prog <= 0) { F.prog = 0; F.result = 'lose'; }
}

function splitCoins(b, plat) {
  b = Math.max(0, Math.round(b));
  let p = 0; if (plat) { p = Math.floor(b / 1e6); b %= 1e6; }
  const g = Math.floor(b / 1e4); b %= 1e4;
  return { p, g, s: Math.floor(b / 100), b: b % 100 };
}
function showPlat() { return !!(S && S.seenPlat); }
function coinHTML(v) {
  const c = splitCoins(v, showPlat()); const out = [];
  if (c.p) out.push(`${c.p}<i class="coin p"></i>`);
  if (c.g) out.push(`${c.g}<i class="coin g"></i>`);
  if (c.s) out.push(`${c.s}<i class="coin s"></i>`);
  if (c.b || !out.length) out.push(`${c.b}<i class="coin b"></i>`);
  return `<span class="coins">${out.join(' ')}</span>`;
}
function coinText(v) {
  const c = splitCoins(v, showPlat()); const out = [];
  if (c.p) out.push(c.p + 'p'); if (c.g) out.push(c.g + 'g'); if (c.s) out.push(c.s + 's');
  if (c.b || !out.length) out.push(c.b + 'b');

}

let AC = null, noiseBuf = null;
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(f, dur, type = 'sine', vol = 0.12, slide = 0, delay = 0) {
  if (!SET.sound) return; const a = ac(); if (!a) return;
  const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + 0.05);
}
function noise(dur, vol = 0.2, freq = 900, delay = 0) {
  if (!SET.sound) return; const a = ac(); if (!a) return;
  if (!noiseBuf) { noiseBuf = a.createBuffer(1, a.sampleRate, a.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  const t = a.currentTime + delay, src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  src.buffer = noiseBuf; f.type = 'lowpass'; f.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(f).connect(g).connect(a.destination); src.start(t); src.stop(t + dur + 0.05);
}

const Scenes = {};
let scene = null, sceneName = '';
function go(name, arg) {
  if (scene && scene.exit) scene.exit();
  sceneName = name; scene = Scenes[name];
  const hud = document.getElementById('hud'); if (hud) hud.classList.remove('fishing');
  if (scene.enter) scene.enter(arg);
  updateHUD();
}
const fade = { a: 0, dir: 0, cb: null };
function transition(cb) { if (fade.dir) return; fade.dir = 1; fade.cb = cb; }

// ---------- particles ----------
function addP(list, p) { list.push(Object.assign({ x: 0, y: 0, vx: 0, vy: 0, g: 0, life: 1, max: 1, r: 3, col: '#fff', fade: 1, shrink: 0 }, p)); }
function updP(list, dt) {
  for (let i = list.length - 1; i >= 0; i--) {
    const p = list[i]; p.life -= dt; if (p.life <= 0) { list.splice(i, 1); continue; }
    p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; if (p.drag) { p.vx *= 1 - p.drag * dt; p.vy *= 1 - p.drag * dt; }
  }
}
function drawP(c, list) {
  for (const p of list) {
    const k = p.life / p.max;
    c.globalAlpha = p.fade ? Math.min(1, k * 1.5) : 1;
    c.fillStyle = p.col;
    if (p.txt) { c.font = `bold ${p.r}px Fredoka, sans-serif`; c.textAlign = 'center'; c.strokeStyle = 'rgba(0,0,0,.6)'; c.lineWidth = 3; c.strokeText(p.txt, p.x, p.y); c.fillText(p.txt, p.x, p.y); }
    else if (p.ring) { c.strokeStyle = p.col; c.lineWidth = 2; c.beginPath(); c.arc(p.x, p.y, p.r * (1 + (1 - k) * p.ring), 0, TAU); c.stroke(); }
    else { c.beginPath(); c.arc(p.x, p.y, Math.max(0.3, p.shrink ? p.r * k : p.r), 0, TAU); c.fill(); }
  }
  c.globalAlpha = 1;
}
function splash(list, x, y, n, col, power = 1) {
  for (let i = 0; i < n; i++) { const a = -Math.PI / 2 + rand(-1.1, 1.1); const sp = rand(60, 180) * power; addP(list, { x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, g: 380, life: rand(0.4, 0.8), max: 0.8, r: rand(1.5, 3.5), col: col || 'rgba(220,245,255,.9)' }); }
  addP(list, { x, y, life: 0.6, max: 0.6, r: 8 * power, ring: 3, col: 'rgba(255,255,255,.7)' });
}
function floatText(list, x, y, txt, col, size = 18) { addP(list, { x, y, vy: -40, life: 1.6, max: 1.6, txt, col, r: size }); }

  },
  draw() {

// ---------------- HUD ----------------
function updateHUD() {
  const hud = $('#hud');
  const inGame = S && sceneName && sceneName !== 'menu' && sceneName !== 'boss';
  hud.classList.toggle('hidden', !inGame);
  if (!inGame) return;
  updateCoins();
  const sea = sceneName === 'sea', map = sceneName === 'map', isl = sceneName === 'island';
  $('#weight').classList.toggle('hidden', !(sea || map));
  $('#btnPort').classList.toggle('hidden', !sea);
  $('#btnSail').classList.toggle('hidden', !isl);
  $('#btnCloseMap').classList.toggle('hidden', !map);
  $('#locname').innerHTML = isl ? esc(ISLANDS[S.loc.id].name) : sea ? `${esc(AREAS[S.loc.area].sea)} <span class="tierchip" style="background:${TIER_COL[AREAS[S.loc.area].tier]}">Tier ${AREAS[S.loc.area].tier}</span>` : map ? 'World Map' : '';
  updateWeight(); renderQuest(false);
  $('#basketCount').textContent = S.basket.length ? S.basket.length : '';
}
function updateWeight() {
  if (!S) return;
  const w = basketWeight(), cap = capacity(), f = clamp(w / cap, 0, 1);
  $('#weight .wfill').style.width = (f * 100) + '%';
  $('#weight .wfill').style.background = f > 0.9 ? '#ff5a5a' : f > 0.7 ? '#ffcf4a' : '#5fe07a';
  $('#weight .wtext').textContent = `${w.toFixed(1)} / ${cap} kg`;
}
function renderQuest(flash) {
  if (!S) return;
  const q = QUESTS[S.quest], box = $('#questbox');
  if (!q) { box.querySelector('.qlabel').textContent = 'Legend'; box.querySelector('.qtitle').textContent = 'All quests complete!'; box.querySelector('.qtext').textContent = 'You are a legend of the seas. Keep fishing!'; return; }
  box.querySelector('.qlabel').textContent = `Quest ${S.quest + 1}`;
  box.querySelector('.qtitle').textContent = q.t;
  box.querySelector('.qtext').textContent = q.d();
  if (flash) { box.classList.remove('flash'); void box.offsetWidth; box.classList.add('flash'); }
}
function questTarget() { if (!S) return null; const q = QUESTS[S.quest]; return q ? q.target() : null; }
function questTick() {
  if (!S) return;
  let q = QUESTS[S.quest], done = [];
  while (q && q.done()) { done.push(q.t); S.quest++; q = QUESTS[S.quest]; if (q && q.start) q.start(); }
  if (done.length) {
    sfx('quest');
    toast(`<b>✔ Quest complete:</b> ${esc(done[done.length - 1])}`, 'quest');
    if (q) setTimeout(() => toast(`<b>New quest:</b> ${esc(q.t)}`, 'quest'), 700);
    save(true);
  }
  renderQuest(done.length > 0);
}
function domQuestArrows() {
  if (!S || !scene) return;
  const qt = questTarget();
  let port = false, sail = false;
  if (qt && sceneName === 'sea') {
    const here = Scenes.sea.area;
    port = !(qt.catch || (qt.boss && here === 9) || (qt.area === here));
    if (basketWeight() >= capacity() - 0.05) port = true;
  }
  if (qt && sceneName === 'island') { const id = Scenes.island.id; sail = !(qt.island === id); }
  $('#btnPort').classList.toggle('qarrow', port);
  $('#btnSail').classList.toggle('qarrow', sail);
}

// ---------------- dialog ----------------
function say(name, lookKey, lines, onDone) {
  DLG = { name, look: lookKey, lines: lines.slice(), i: 0, shown: 0, onDone };
  const d = $('#dialog'); d.classList.remove('hidden');
  d.querySelector('.dname').textContent = name || '';
  d.querySelector('.dname').classList.toggle('hidden', !name);
  const pc = $('#portrait'); pc.classList.toggle('hidden', !lookKey);
  if (lookKey) { const c = pc.getContext('2d'); c.clearRect(0, 0, 90, 90); c.fillStyle = '#21486e'; c.beginPath(); c.arc(45, 45, 44, 0, TAU); c.fill(); c.save(); c.beginPath(); c.arc(45, 45, 42, 0, TAU); c.clip(); drawPerson(c, 42, 160, 1.6, LOOKS[lookKey], { face: 1, t: 0 }); c.restore(); }
  renderDialog();
}
function renderDialog() { if (!DLG) return; $('#dialog .dtext').textContent = DLG.lines[DLG.i].slice(0, Math.floor(DLG.shown)); }
function tickDialog(dt) { if (!DLG) return; const L = DLG.lines[DLG.i]; if (DLG.shown < L.length) { DLG.shown = Math.min(L.length, DLG.shown + dt * 55); renderDialog(); } }
function advanceDialog() {
  if (!DLG) return; sfx('click');
  const L = DLG.lines[DLG.i];
  if (DLG.shown < L.length) { DLG.shown = L.length; renderDialog(); return; }
  DLG.i++; DLG.shown = 0;
  if (DLG.i >= DLG.lines.length) { const cb = DLG.onDone; DLG = null; $('#dialog').classList.add('hidden'); cb && cb(); }
  else renderDialog();
}

// ---------------- panels ----------------
function openPanel(id, title, render, opts = {}) { PANEL = Object.assign({ id, title, render }, opts); $('#modal').classList.remove('hidden'); renderPanel(); }
function renderPanel() {
  if (!PANEL) return;
  const m = $('#modal'), body = m.querySelector('.panel-body'), keep = body ? body.scrollTop : 0;
  m.innerHTML = `<div class="panel ${PANEL.cls || ''}"><div class="panel-head"><span class="ptitle">${PANEL.title}</span>${PANEL.noClose ? '' : '<button class="btn ghost iconbtn small" data-act="close" title="Close (Esc)">✕</button>'}</div><div class="panel-body">${PANEL.render()}</div></div>`;
  const nb = m.querySelector('.panel-body'); if (nb) nb.scrollTop = keep;
  drawIcons(m);
  PANEL.after && PANEL.after();
}
function closePanel() { if (!PANEL) return; const cb = PANEL.onClose; PANEL = null; $('#modal').classList.add('hidden'); $('#modal').innerHTML = ''; hideTip(); cb && cb(); }
function drawIcons(root) {
  root.querySelectorAll('canvas[data-sp]').forEach(cv => {
    const c = cv.getContext('2d'), sp = SPECIES_BY_ID[cv.dataset.sp], w = cv.width, h = cv.height;
    c.clearRect(0, 0, w, h);
    drawFish(c, sp, w / 2, h / 2 + (sp.shape === 'jelly' ? h * 0.08 : 0), Math.min(w * 0.82, h * 1.6), { sil: cv.dataset.sil ? 'rgba(10,25,45,.85)' : null, t: 0.4 });
  });
  root.querySelectorAll('canvas[data-part]').forEach(cv => drawPartIcon(cv.getContext('2d'), cv.dataset.part, +cv.dataset.tier, cv.width, cv.height));
}
function drawPartIcon(c, kind, tier, w, h, t = 0) {
  c.clearRect(0, 0, w, h);
  if (kind === 'rod') {
    c.save(); c.translate(w * 0.15, h * 0.8); c.rotate(-0.6);
    const L = w * 0.85, col = PARTS.rod.col[tier], acc = PARTS.rod.acc[tier];
    if (tier >= 7) { c.shadowColor = acc; c.shadowBlur = 8; }
    for (let i = 0; i < 10; i++) { c.strokeStyle = col; c.lineWidth = 6 - i * 0.45; c.lineCap = 'round'; c.beginPath(); c.moveTo(L * i / 10, tier === 0 && i > 6 ? (i - 6) * 2 : 0); c.lineTo(L * (i + 1) / 10, tier === 0 && i >= 6 ? (i - 5) * 2 : 0); c.stroke(); }
    c.shadowBlur = 0; c.strokeStyle = acc; c.lineWidth = 2;
    for (let i = 1; i < 2 + Math.ceil(tier / 3) + 1; i++) { const x = L * i * 0.17; c.beginPath(); c.moveTo(x - 1, -4); c.lineTo(x + 1, 4); c.stroke(); }
    c.restore();
  } else if (kind === 'reel') {
    const r = Math.min(w, h) * 0.34, cx = w / 2, cy = h / 2, col = PARTS.reel.col[tier], acc = PARTS.reel.acc[tier];
    if (tier >= 8) { c.shadowColor = col; c.shadowBlur = 10; }
    const g = c.createRadialGradient(cx - r * 0.3, cy - r * 0.3, 1, cx, cy, r); g.addColorStop(0, shade(col, 0.45)); g.addColorStop(1, col);
    c.fillStyle = g; c.beginPath(); c.arc(cx, cy, r, 0, TAU); c.fill(); c.shadowBlur = 0;
    c.strokeStyle = shade(col, -0.35); c.lineWidth = 2; c.stroke();
    c.strokeStyle = acc; c.lineWidth = 2; const sp = 2 + Math.floor(tier / 3);
    for (let i = 0; i < sp; i++) { const a = t + i / sp * TAU; c.beginPath(); c.moveTo(cx, cy); c.lineTo(cx + Math.cos(a) * r * 0.8, cy + Math.sin(a) * r * 0.8); c.stroke(); }
    if (tier >= 6) { c.beginPath(); c.arc(cx, cy, r * 0.55, 0, TAU); c.stroke(); }
    if (tier === 0) { c.fillStyle = '#4a2a14'; for (let i = 0; i < 4; i++) { c.beginPath(); c.arc(cx + Math.cos(i * 2) * r * 0.6, cy + Math.sin(i * 2) * r * 0.6, r * 0.16, 0, TAU); c.fill(); } }
    c.strokeStyle = shade(col, -0.2); c.lineWidth = 3; c.beginPath(); c.moveTo(cx, cy); c.lineTo(cx + r * 1.3, cy - r * 0.6); c.stroke();
    c.fillStyle = acc; c.beginPath(); c.arc(cx + r * 1.3, cy - r * 0.6, 3.5, 0, TAU); c.fill();
  } else {
    drawHook(c, w * 0.45, h * 0.2, tier, Math.min(w, h) / 18, t);
  }
}
function drawRodPreview(cv, eq, t, opts = {}) {
  const c = cv.getContext('2d'), w = cv.width, h = cv.height;
  c.clearRect(0, 0, w, h);
  const g = c.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#1b3d60'); g.addColorStop(1, '#0d2238'); c.fillStyle = g; c.fillRect(0, 0, w, h);
  c.strokeStyle = 'rgba(255,255,255,.05)'; for (let x = 0; x < w; x += 20) { c.beginPath(); c.moveTo(x, 0); c.lineTo(x, h); c.stroke(); }
  const tip = drawRod(c, w * 0.1, h * 0.66, w * 0.78, -0.36, eq, { t, bend: 0.12 + Math.sin(t * 1.5) * 0.04, spin: t * 2 });
  c.strokeStyle = 'rgba(255,255,255,.7)'; c.lineWidth = 1;
  const hy = tip.y + h * 0.35 + Math.sin(t * 2) * 4;
  c.beginPath(); c.moveTo(tip.x, tip.y); c.lineTo(tip.x + 3, hy); c.stroke();
  drawHook(c, tip.x + 3, hy, eq.hook, 1.8, t);
  if (opts.fx) opts.fx(c, w, h);
}

// ---------------- tooltip ----------------
function showTip(html, x, y) { const t = $('#tooltip'); t.innerHTML = html; t.classList.remove('hidden'); const r = t.getBoundingClientRect(); t.style.left = clamp(x + 16, 6, W - r.width - 6) + 'px'; t.style.top = clamp(y + 12, 6, H - r.height - 6) + 'px'; }
function hideTip() { $('#tooltip').classList.add('hidden'); }
function fishTipHTML(f) {
  const sp = SPECIES_BY_ID[f.sp], R = RARITIES[f.r];
  return `<div class="tt-name" style="color:${R.c}">${esc(sp.name)}</div>
  <div class="tt-sub">Tier ${sp.tier} · ${esc(AREAS[sp.area].sea)}</div>
  <table class="tt"><tr><td>Weight</td><td>${f.w} kg</td></tr>
  <tr><td>Base value</td><td>${coinHTML(sp.base)}</td></tr>
  <tr><td>Rarity</td><td style="color:${R.c}">${R.n} ${R.m}×</td></tr>
  <tr class="tt-final"><td>Final value</td><td>${coinHTML(fishValue(f))}</td></tr></table>`;
}
document.addEventListener('mouseover', e => { const el = e.target.closest('[data-fid]'); if (!el || !S) return; const f = S.basket.find(x => x.id == el.dataset.fid) || (CATCH && CATCH.fish.id == el.dataset.fid ? CATCH.fish : null); if (f) showTip(fishTipHTML(f), e.clientX, e.clientY); });
document.addEventListener('mousemove', e => { const el = e.target.closest('[data-fid]'); if (!el) { hideTip(); return; } const t = $('#tooltip'); if (!t.classList.contains('hidden')) showTip(t.innerHTML, e.clientX, e.clientY); });

// ---------------- interaction ----------------
function interact(id) {
  sfx('click');
  switch (id) {
    case 'elder':
      if (!S.flags.metElder) say('Elder Wren', 'elder', LINES.elderIntro, () => { S.flags.metElder = true; questTick(); save(true); });
      else say('Elder Wren', 'elder', [S.kraken ? LINES.elderWin[0] : pick(LINES.elderIdle)]);
      break;
    case 'driftwood':
      if (!S.hasRod) say('', null, LINES.driftwood, () => {
        ['rod', 'reel', 'hook'].forEach(k => { if (!S.parts[k].includes(0)) S.parts[k].push(0); });
        S.eq = { rod: 0, reel: 0, hook: 0 }; S.hasRod = true;
        itemReveal('Broken Fishing Rod', 'A cracked branch rod, a rusty spool and a bent nail for a hook. It’s not much, but it’s a start!', (c, w, h, t) => drawRodPreview({ getContext: () => c, width: w, height: h }, { rod: 0, reel: 0, hook: 0 }, t), () => { questTick(); save(true); });
      });
      else toast('Just soggy driftwood now.');
      break;
    case 'shipwright':
      if (!S.hasBoat) say('Bram the Shipwright', 'bram', LINES.bramIntro, () => {
        S.hasBoat = true;
        itemReveal('Leaky Raft', 'Five logs and some rope. It carries 15 kg of fish. Upgrade it at Bram’s Boatyard!', (c, w, h, t) => { boatPreviewBg(c, w, h); drawBoatSide(c, w / 2, h * 0.68, 0, 0, 1.3, t); }, () => { questTick(); save(true); });
      });
      else openShipwright();
      break;
    case 'fishmonger': openFishmonger(); break;
    case 'tackle':
      if (!S.flags.metMarlow) say('Old Marlow', 'marlow', LINES.marlowIntro, () => { S.flags.metMarlow = true; openTackle(); });
      else openTackle();
      break;
    case 'blacksmith':
      if (!S.flags.metGreta) say('Greta the Blacksmith', 'greta', LINES.gretaIntro, () => { S.flags.metGreta = true; questTick(); openBlacksmith(); });
      else openBlacksmith();
      break;
    case 'collector':
      if (!S.flags.metCurator) say('The Curator', 'curator', LINES.curatorIntro, () => { S.flags.metCurator = true; questTick(); openCollector(); });
      else openCollector();
      break;
    case 'pier': setSail(); break;
  }
}
function setSail() {
  if (!S.hasBoat) { say('', null, ['You don’t have a boat yet. Maybe Bram the Shipwright can help.']); return; }
  if (!S.hasRod) { say('', null, ['You should find something to fish with first...']); return; }
  const isl = Scenes.island;
  if (isl && sceneName === 'island') isl.P.tx = null;
  transition(() => go('map', { from: 'island' }));
}
function boatPreviewBg(c, w, h) {
  const g = c.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#8fd0f0'); g.addColorStop(0.68, '#d8f0ff'); g.addColorStop(0.68, '#2a8fbf'); g.addColorStop(1, '#155a85');
  c.fillStyle = g; c.fillRect(0, 0, w, h);
}

// ---------------- item reveal ----------------
function itemReveal(title, desc, drawFn, onClose) {
  sfx('newsp');
  openPanel('reveal', 'You got an item!', () => `<div class="reveal"><div class="rays"></div><canvas id="revealCv" width="420" height="220"></canvas><div class="rv-title">${esc(title)}</div><div class="rv-desc">${esc(desc)}</div><button class="btn gold big" data-act="close">Awesome!</button></div>`,
    { cls: 'narrow', onClose, anim: dt => { PANEL.t = (PANEL.t || 0) + dt; const cv = $('#revealCv'); if (cv) { const c = cv.getContext('2d'); c.clearRect(0, 0, cv.width, cv.height); drawFn(c, cv.width, cv.height, PANEL.t); } } });
}

// ---------------- basket / fishmonger ----------------
function fishRow(f, mode) {
  const sp = SPECIES_BY_ID[f.sp], R = RARITIES[f.r];
  const btn = mode === 'sell' ? `<button class="btn green small" data-act="sell" data-fid="${f.id}">Sell</button>`
    : mode === 'donate' ? `<button class="btn gold small" data-act="donate" data-fid="${f.id}">Donate +${coinText(sp.base * 2)}</button>` : '';
  return `<div class="fishrow r${f.r}" data-fid="${f.id}"><canvas width="66" height="40" data-sp="${f.sp}"></canvas>
    <div class="fr-main"><div class="fr-name" style="color:${R.c}">${esc(sp.name)}${sp.boss ? ' 🏆' : ''}</div><div class="fr-meta"><span class="rchip" style="background:${R.c}">${R.n}</span> Tier ${sp.tier} · ${f.w} kg</div></div>
    <div class="fr-val">${coinHTML(fishValue(f))}</div>${btn}</div>`;
}
function basketHTML(mode) {
  if (!S.basket.length) return `<div class="empty">Your basket is empty. Catch some fish!</div>`;
  const list = S.basket.slice().reverse();
  const total = S.basket.reduce((a, f) => a + fishValue(f), 0);
  return `<div class="basket-sum"><span>${S.basket.length} fish · ${basketWeight().toFixed(1)} / ${capacity()} kg</span><span>Total value: ${coinHTML(total)}</span></div>
   <div class="hint">${isTouch ? 'Tap and hold' : 'Hover over'} a fish to see how its price is worked out.</div>
   <div class="fishlist">${list.map(f => fishRow(f, mode)).join('')}</div>`;
}
function openBasket() {
  openPanel('basket', '🧺 Fishing Basket', () => basketHTML(null) + (S.loc.type === 'island' && S.loc.id === 'driftwood' ? '' : `<div class="hint center">Sell fish to Pip at the fish stall on Driftwood Isle.</div>`));
}
function openFishmonger() {
  if (!S.basket.length) { say('Pip the Fishmonger', 'pip', LINES.pipEmpty); return; }
  openPanel('sell', '🐟 Pip’s Fish Stall', () => {
    const total = S.basket.reduce((a, f) => a + fishValue(f), 0);
    const commons = S.basket.filter(f => f.r === 0);
    return `<div class="shopkeep"><canvas class="pcanvas" data-look="pip" width="80" height="80"></canvas><div class="sk-text">“Fresh catch! Price is the fish’s <b>base value</b> (set by its tier) times its <b>rarity</b> multiplier.”</div></div>
      <div class="row gap">${S.basket.length ? `<button class="btn gold" data-act="sellall">Sell all (${coinHTML(total)})</button>` : ''}${commons.length && commons.length < S.basket.length ? `<button class="btn" data-act="sellcommon">Sell Commons only</button>` : ''}</div>
      ${basketHTML('sell')}`;
  }, { after: drawPortraits });
}
function drawPortraits() { document.querySelectorAll('canvas[data-look]').forEach(cv => { const c = cv.getContext('2d'); c.clearRect(0, 0, cv.width, cv.height); c.fillStyle = '#21486e'; c.beginPath(); c.arc(40, 40, 39, 0, TAU); c.fill(); c.save(); c.beginPath(); c.arc(40, 40, 37, 0, TAU); c.clip(); drawPerson(c, 37, 145, 1.45, LOOKS[cv.dataset.look], { face: 1 }); c.restore(); }); }
function sellFish(ids, fromEl) {
  let total = 0, n = 0;
  ids.forEach(id => { const i = S.basket.findIndex(f => f.id == id); if (i < 0) return; total += fishValue(S.basket[i]); S.basket.splice(i, 1); n++; });
  if (!n) return;
  S.stats.sold += n; addMoney(total); flyCoins(fromEl, 3 + n); sfx('coin');
  toast(`Sold ${n} fish for ${coinHTML(total)}`, 'money');
  questTick(); save(true); updateHUD();
  if (!S.basket.length) { closePanel(); say('Pip the Fishmonger', 'pip', ['Pleasure doing business! Come back with more.']); }
  else renderPanel();
}

// ---------------- tackle hut ----------------

    <div class="card big-card"><canvas id="tackleCv" width="520" height="180"></canvas>

// ---------------- blacksmith ----------------
function openBlacksmith() {
  openPanel('smith', '⚒️ Greta’s Forge', () => {
    const tab = PANEL.tab || 'rod', P = PARTS[tab], owned = S.parts[tab], maxO = owned.length ? Math.max(...owned) : -1;
    const rows = [];
    for (let t = owned.includes(0) ? 0 : 1; t <= 10; t++) {
      const has = owned.includes(t), eq = S.eq[tab] === t, cost = t === 1 ? 4 : PART_COST[t], canForge = !has && t <= maxO + 1;
      let act;
      if (eq) act = `<span class="badge eq">Equipped</span>`;
      else if (has) act = `<button class="btn small" data-act="equip" data-kind="${tab}" data-tier="${t}">Equip</button>`;
      else if (canForge) act = `<button class="btn gold small" data-act="forge" data-kind="${tab}" data-tier="${t}" ${S.money < cost ? 'disabled' : ''}>Forge ${coinHTML(cost)}</button>`;
      else act = `<span class="badge lock">🔒 Forge tier ${t - 1} first</span>`;
      rows.push(`<div class="partrow ${eq ? 'is-eq' : ''} ${!has && !canForge ? 'locked' : ''}" data-prev-kind="${tab}" data-prev-tier="${t}">
        <canvas width="70" height="44" data-part="${tab}" data-tier="${t}"></canvas>
        <div class="pr-main"><div class="pr-name">${esc(P.names[t])} <span class="tierchip" style="background:${TIER_COL[Math.max(1, t)]}">T${t}</span></div><div class="pr-stat">${partStatText(tab, t)}</div></div>${act}</div>`);
    }
    const tabs = ['rod', 'reel', 'hook'].map(k => `<button class="tab ${k === tab ? 'on' : ''}" data-act="tab" data-tab="${k}">${PARTS[k].label}</button>`).join('');
    return `<div class="smith-top"><canvas id="smithCv" width="560" height="200"></canvas>
      <div class="eqlist">${['rod', 'reel', 'hook'].map(k => `<div><span class="muted">${PARTS[k].label}:</span> <b>${esc(PARTS[k].names[S.eq[k]])}</b></div>`).join('')}<div class="muted small">${PANEL.prev ? 'Previewing: ' + esc(PARTS[PANEL.prev.kind].names[PANEL.prev.tier]) : 'Hover a part to preview it on your rod.'}</div></div></div>
      <div class="tabs">${tabs}</div><div class="hint">${esc(P.label)}: ${esc(P.stat)}</div><div class="partlist">${rows.join('')}</div>`;
  }, {
    cls: 'wide', tab: 'rod', after: () => {
      document.querySelectorAll('[data-prev-kind]').forEach(el => {
        el.onmouseenter = () => { PANEL.prev = { kind: el.dataset.prevKind, tier: +el.dataset.prevTier }; const e = document.querySelector('.eqlist .small'); if (e) e.textContent = 'Previewing: ' + PARTS[PANEL.prev.kind].names[PANEL.prev.tier]; };
        el.onmouseleave = () => { PANEL.prev = null; };
      });

// ---------------- catch card ----------------
function showCatchCard(fish, isNew, onDone) {
  const sp = SPECIES_BY_ID[fish.sp], R = RARITIES[fish.r];
  // record discovery & stats immediately
  const d = dexEntry(fish.sp); d.n++; d.best = Math.max(d.best, fish.w); d.rar[fish.r] = 1;
  S.stats.caught++;
  const free = capacity() - basketWeight(), fits = fish.w <= free + 1e-6;
  let throwBack = [];
  if (!fits) {
    const sorted = S.basket.slice().sort((a, b) => fishValue(a) / Math.max(0.1, a.w) - fishValue(b) / Math.max(0.1, b.w));
    let need = fish.w - free;
    for (const f of sorted) { if (need <= 0) break; if (fishValue(f) >= fishValue(fish)) continue; throwBack.push(f); need -= f.w; }
    if (need > 0) throwBack = null;
  }
  CATCH = { fish, isNew, onDone, throwBack };
  isNew ? sfx('newsp') : (fish.r >= 3 ? sfx('newsp') : null);
  openPanel('catch', isNew ? '✨ New species discovered!' : 'You caught a fish!', () => `
    <div class="catch ${isNew ? 'isnew' : ''} r${fish.r}">${isNew ? '<div class="rays"></div><div class="newtag">NEW!</div>' : ''}
      <canvas id="catchCv" width="420" height="200" data-fid="${fish.id}"></canvas>
      <div class="c-name" style="color:${R.c}">${esc(sp.name)}</div>
      <div class="c-meta"><span class="rchip" style="background:${R.c}">${R.n}</span> Tier ${sp.tier} · ${fish.w} kg</div>
      <div class="c-calc">Base value ${coinHTML(sp.base)} × ${R.n} ${R.m}× = <b>${coinHTML(fishValue(fish))}</b></div>
      ${fits ? `<button class="btn gold big" data-act="keep">Into the basket!</button>`
      : `<div class="warn">Your hold is too full for this fish (${free.toFixed(1)} kg free).</div><div class="row gap center">
         ${throwBack ? `<button class="btn gold" data-act="swap">Make room (throw back ${throwBack.length} cheaper fish)</button>` : ''}
         <button class="btn" data-act="release">Release it</button></div>`}
    </div>`, {
    cls: 'narrow', noClose: true, anim: dt => {
      PANEL.t = (PANEL.t || 0) + dt; const cv = $('#catchCv'); if (!cv) return;
      const c = cv.getContext('2d'), w = cv.width, h = cv.height, t = PANEL.t;
      c.clearRect(0, 0, w, h);
      const pop = Math.min(1, easeOutBack(clamp(t / 0.6, 0, 1)));
      if (fish.r >= 3 || isNew) { c.save(); c.translate(w / 2, h / 2); c.rotate(t * 0.5); const rg = c.createRadialGradient(0, 0, 10, 0, 0, h * 0.75); rg.addColorStop(0, (fish.r >= 3 ? R.c : '#ffe08a') + '66'); rg.addColorStop(1, (fish.r >= 3 ? R.c : '#ffe08a') + '00'); c.fillStyle = rg; for (let i = 0; i < 12; i++) { c.rotate(TAU / 12); c.beginPath(); c.moveTo(0, 0); c.lineTo(w, -34); c.lineTo(w, 34); c.fill(); } c.restore(); }
      drawFish(c, sp, w / 2, h / 2 + Math.sin(t * 2) * 4, Math.min(260, 150 + fish.r * 18) * pop, { t, glow: fish.r >= 4, rot: Math.sin(t * 1.5) * 0.06 });
      if (Math.random() < dt * (isNew ? 30 : 8)) { PANEL.sp = PANEL.sp || []; addP(PANEL.sp, { x: rand(0, w), y: rand(0, h), vy: -20, life: 1, max: 1, r: rand(1.5, 3), col: isNew ? '#ffe08a' : R.c }); }
      if (PANEL.sp) { updP(PANEL.sp, dt); drawP(c, PANEL.sp); }
    }
  });
  if (isNew) setTimeout(() => toast(`<b>Bestiary:</b> ${esc(sp.name)} added! (${dexCount()}/${SPECIES.length})`, 'quest'), 500);
}
function finishCatch(action) {
  const C = CATCH; if (!C) return;
  if (action === 'keep' || action === 'swap') {
    if (action === 'swap' && C.throwBack) C.throwBack.forEach(f => { const i = S.basket.indexOf(f); if (i >= 0) S.basket.splice(i, 1); });
    S.basket.push(C.fish);
    toast(`${esc(SPECIES_BY_ID[C.fish.sp].name)} added to your basket`, '');
  } else toast('You released the fish. It swims away happily.');
  CATCH = null; closePanel();
  questTick(); updateHUD(); save(true);
  if (basketWeight() >= capacity() - 0.05) toast('Your hold is full! Head back to port to sell.', 'warn');
  C.onDone && C.onDone();
}

const ACT = {
  close: () => { if (PANEL && PANEL.noClose) return; closePanel(); },

  sellcommon: (d, el) => sellFish(S.basket.filter(f => f.r === 0).map(f => f.id), el),
  buystarter: (d, el) => {

    addMoney(-STARTER_PRICE); ['rod', 'reel', 'hook'].forEach(k => { if (!S.parts[k].includes(1)) S.parts[k].push(1); });
    S.eq = { rod: 1, reel: 1, hook: 1 }; sfx('buy'); closePanel();
    itemReveal('Starter Rod Set', 'Willow Rod, Wooden Spinner and Bone Hook — equipped! A wider catch zone, faster reeling and a better grip.', (c, w, h, t) => drawRodPreview({ getContext: () => c, width: w, height: h }, { rod: 1, reel: 1, hook: 1 }, t), () => { questTick(); save(true); });
  },

  forge: (d, el) => {
    const t = +d.tier, cost = t === 1 ? 4 : PART_COST[t];
    if (S.money < cost) return sfx('error');
    addMoney(-cost); S.parts[d.kind].push(t); S.eq[d.kind] = t; sfx('forge'); setTimeout(() => sfx('forge'), 250); setTimeout(() => sfx('buy'), 520);
    forgeFx(60); toast(`Forged & equipped <b>${esc(PARTS[d.kind].names[t])}</b>!`, 'quest');
    questTick(); save(true); renderPanel();
  },
  buyhull: () => { const n = HULLS[S.hull + 1]; if (!n || S.money < n.cost) return sfx('error'); addMoney(-n.cost); S.hull++; sfx('forge'); setTimeout(() => sfx('buy'), 300); forgeFx(50); toast(`Your boat is now a <b>${esc(n.n)}</b>! Carry limit ${n.cap} kg.`, 'quest'); questTick(); save(true); renderPanel(); updateHUD(); },
  buysail: () => { const n = SAILS[S.sail + 1]; if (!n || S.money < n.cost) return sfx('error'); addMoney(-n.cost); S.sail++; sfx('forge'); setTimeout(() => sfx('buy'), 300); forgeFx(50); const un = AREAS.filter(a => a.sail === S.sail).map(a => a.name); toast(`Fitted the <b>${esc(n.n)}</b>!${un.length ? ' New areas: ' + esc(un.join(', ')) : ''}`, 'quest'); questTick(); save(true); renderPanel(); },
  donate: (d, el) => {
    const i = S.basket.findIndex(f => f.id == d.fid); if (i < 0) return;
    const f = S.basket[i], sp = SPECIES_BY_ID[f.sp]; S.basket.splice(i, 1);
    dexEntry(f.sp).don = true; S.stats.donated++;
    addMoney(sp.base * 2); flyCoins(el, 6); sfx('newsp');
    toast(`The Curator adds the <b>${esc(sp.name)}</b> to his collection!`, 'quest');
    questTick(); save(true); updateHUD(); renderPanel();
  },
  dextab: d => { PANEL.tab = +d.tab; renderPanel(); },
  keep: () => finishCatch('keep'), swap: () => finishCatch('swap'), release: () => finishCatch('release'),
  fightkraken: () => { closePanel(); transition(() => go('boss')); },
  victorydone: () => { closePanel(); transition(() => { go('sea', { area: 9 }); Scenes.sea.boat.y = -1050 + 380; Scenes.sea.cam.y = Scenes.sea.boat.y; }); },
  mapclose: () => closeMapCard(),
  travel: d => startTravel(+d.area, d.mode),
  questlog: () => openQuestLog(),
  savegame: () => { save(false); },
  savecode: () => {
    const code = exportCode();
    openPanel('code', '🔑 Save Code', () => `<p>Copy this code and use <b>Load Game → Import</b> on another device or browser.</p><textarea id="codebox" readonly>${code}</textarea><div class="row gap"><button class="btn gold" data-act="copycode">Copy</button><button class="btn" data-act="close">Done</button></div>`, { cls: 'narrow' });
  },
  copycode: () => { const t = $('#codebox'); t.select(); try { navigator.clipboard.writeText(t.value).then(() => toast('Copied!')); } catch (e) { document.execCommand('copy'); toast('Copied!'); } },
  howto: () => openPanel('howto', '❓ How to Play', howToHTML, { cls: 'narrow' }),
  patch: () => openPanel('patch', '📰 Patch Notes', patchHTML, { cls: 'narrow' }),
  sound: () => { SET.sound = !SET.sound; saveSettings(); if (PANEL && PANEL.id === 'pause') renderPanel(); else if (PANEL) renderPanel(); toast('Sound ' + (SET.sound ? 'on' : 'off')); },
  tomenu: () => { save(true); closePanel(); transition(() => go('menu')); },
  // main menu
  continue: () => { const last = +(localStorage.getItem('fishingRise_last') || 0); const s = readSlot(last); if (s) startGame(s); },
  newgame: () => openPanel('slots', 'New Game — choose a save slot', () => slotsHTML('new'), { cls: 'narrow' }),
  loadgame: () => openPanel('slots', 'Load Game', () => slotsHTML('load'), { cls: 'narrow' }),
  newslot: d => { if (d.over && !confirm(`Overwrite Slot ${d.slot}? That save will be lost.`)) return; startGame(newState(+d.slot), true); },
  loadslot: d => { const s = readSlot(+d.slot); if (s) startGame(s); },
  delslot: d => { if (confirm(`Delete Slot ${d.slot}? This can’t be undone.`)) { deleteSlot(+d.slot); renderPanel(); showMenu(true); } },
  importslot: d => {
    const code = prompt('Paste your Fishing Rise save code:'); if (!code) return;
    try { const s = importCode(code, +d.slot); localStorage.setItem(SAVE_KEY(+d.slot), JSON.stringify(s)); toast('Save imported into Slot ' + d.slot); renderPanel(); showMenu(true); }
    catch (e) { toast('That code didn’t work.', 'warn'); }
  },
  settings: () => openPanel('settings', 'Settings', () => `<div class="menu-col"><button class="btn" data-act="sound">${SET.sound ? '🔊 Sound: On' : '🔇 Sound: Off'}</button><button class="btn" data-act="close">Done</button></div>`, { cls: 'narrow' })
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const a = ACT[el.dataset.act]; if (a) { e.preventDefault(); ac(); a(el.dataset, el); }
});
$('#modal').addEventListener('pointerdown', e => { if (e.target.id === 'modal' && PANEL && !PANEL.noClose) closePanel(); });
$('#dialog').addEventListener('pointerdown', e => { e.preventDefault(); advanceDialog(); });
$('#questbox').addEventListener('click', () => { if (!uiBlocking()) openQuestLog(); });
$('#btnBasket').addEventListener('click', () => { if (!DLG && !PANEL) openBasket(); });
$('#btnPause').addEventListener('click', () => { if (!DLG && !PANEL) openPause(); });
$('#btnPort').addEventListener('click', () => { if (uiBlocking() || Scenes.sea.state !== 'sail') return; transition(() => go('map', { from: 'sea' })); });
$('#btnSail').addEventListener('click', () => { if (uiBlocking()) return; setSail(); });
$('#btnCloseMap').addEventListener('click', () => leaveMap());
// touch fishing pad
['padL', 'padR'].forEach((id, i) => {
  const b = $('#' + id), d = i ? 1 : -1;
  b.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); touchDir = d; ptr.onPad = true; isTouch = true; b.classList.add('on'); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => b.addEventListener(ev, () => { if (touchDir === d) touchDir = 0; b.classList.remove('on'); }));
});
function showFishPad(on) { $('#fishpad').classList.toggle('hidden', !(on && isTouch)); $('#hud').classList.toggle('fishing', !!on); touchDir = 0; }
// long-press tooltips on touch
let lpT = null;
document.addEventListener('touchstart', e => { const el = e.target.closest && e.target.closest('[data-fid]'); if (!el) { hideTip(); return; } const t = e.touches[0]; lpT = setTimeout(() => { const f = S && (S.basket.find(x => x.id == el.dataset.fid) || (CATCH && CATCH.fish)); if (f) showTip(fishTipHTML(f), t.clientX, t.clientY - 120); }, 350); }, { passive: true });
document.addEventListener('touchend', () => clearTimeout(lpT));

function globalKey(k) {
  if (sceneName === 'menu') { if (k === 'escape' && PANEL) { closePanel(); return true; } return false; }
  if (DLG) { if (k === ' ' || k === 'enter' || k === 'e' || k === 'escape') { advanceDialog(); return true; } return true; }
  if (PANEL) {
    if (k === 'escape' && !PANEL.noClose) { closePanel(); return true; }
    if ((k === ' ' || k === 'enter') && PANEL.id === 'catch' && CATCH) { const fits = CATCH.fish.w <= capacity() - basketWeight() + 1e-6; if (fits) finishCatch('keep'); return true; }
    return true;
  }
  if (sceneName === 'boss') return false;
  if (k === 'escape') { if (sceneName === 'map') { leaveMap(); return true; } openPause(); return true; }
  if (k === 'b') { openBasket(); return true; }
  return false;
}

// ================================================================
//  MAIN LOOP & BOOT
// ================================================================
const cv = $('#game'), ctx = cv.getContext('2d');
let W = innerWidth, H = innerHeight, DPR = 1;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1); W = innerWidth; H = innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize); resize();

cv.addEventListener('pointerdown', e => {
  ac();
  if (e.pointerType === 'touch') isTouch = true;
  ptr.type = e.pointerType; ptr.x = e.clientX; ptr.y = e.clientY; ptr.down = true; ptr.moved = performance.now(); ptr.onPad = false;
  if (DLG) { advanceDialog(); return; }
  if (scene && scene.click && !fade.dir) scene.click(e.clientX, e.clientY);
});
window.addEventListener('pointermove', e => { ptr.x = e.clientX; ptr.y = e.clientY; ptr.moved = performance.now(); if (e.pointerType) ptr.type = e.pointerType; });
window.addEventListener('pointerup', () => { ptr.down = false; if (Scenes.sea) Scenes.sea.dragSteer = false; });
window.addEventListener('contextmenu', e => { if (e.target === cv) e.preventDefault(); });

let lastT = performance.now(), autoT = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  try {
    if (scene) { scene.update(dt); ctx.clearRect(0, 0, W, H); scene.draw(); }
    if (fade.dir === 1) { fade.a += dt * 3.5; if (fade.a >= 1) { fade.a = 1; fade.dir = -1; const cb = fade.cb; fade.cb = null; cb && cb(); } }
    else if (fade.dir === -1) { fade.a -= dt * 2.6; if (fade.a <= 0) { fade.a = 0; fade.dir = 0; } }
    if (fade.a > 0) { ctx.fillStyle = `rgba(3,10,20,${fade.a})`; ctx.fillRect(0, 0, W, H); }
    tickDialog(dt);
    if (PANEL && PANEL.anim) PANEL.anim(dt);
    if (S && sceneName && sceneName !== 'menu') {
      S.play += dt; autoT += dt;
      if (autoT > 20) { autoT = 0; save(true); }
      domQuestArrows();
      if (sceneName === 'sea' || sceneName === 'map') updateWeight();
    }
  } catch (err) { console.error(err); }
  requestAnimationFrame(frame);
}
window.addEventListener('beforeunload', () => { if (S && sceneName !== 'menu') save(true); });
document.addEventListener('visibilitychange', () => { if (document.hidden && S && sceneName !== 'menu') save(true); });

go('menu');
requestAnimationFrame(frame);

</script>
</body>
</html>
